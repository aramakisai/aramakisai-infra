---
# Discord OAuth2 IdP (旧terraform/zitadel_idp.tf)。
#
# Zitadelには新旧2系統のIdP設定リソースが並存する(旧: /management/v1/idps、instance/org
# のauthポリシーのallowedIDPsに紐づく。新: /management/v1/idps/templates、login v2 UIが
# 参照するProviderテンプレート)。POST /management/v1/idps/oauthは実際には新系統
# (templates)を作成するため、検索・更新も必ずtemplatesエンドポイントを使うこと
# (旧/management/v1/idps/_searchでは絶対に見つからない、実機で確認済み)。
- name: Discord IdPを検索
  ansible.builtin.include_tasks: _api_call.yml
  vars:
    zitadel_api_method: POST
    zitadel_api_path: /management/v1/idps/templates/_search
    zitadel_api_body:
      query: { offset: "0", limit: 100 }
      queries:
        - idpNameQuery: { name: "{{ zitadel_discord_idp_name }}", method: TEXT_QUERY_METHOD_EQUALS }
    zitadel_api_label: "search idp {{ zitadel_discord_idp_name }}"

- name: Discord IdP検索結果を退避
  ansible.builtin.set_fact:
    _zitadel_idp_search: "{{ zitadel_api_result }}"
  no_log: true

- name: Discord IdPを新規作成
  ansible.builtin.include_tasks: _api_call.yml
  vars:
    zitadel_api_method: POST
    zitadel_api_path: /management/v1/idps/oauth
    zitadel_api_body: &discord_oauth_config
      name: "{{ zitadel_discord_idp_name }}"
      clientId: "{{ zitadel_discord_client_id }}"
      clientSecret: "{{ zitadel_discord_client_secret }}"
      authorizationEndpoint: "https://discord.com/api/oauth2/authorize"
      tokenEndpoint: "https://discord.com/api/oauth2/token"
      userEndpoint: "https://discord.com/api/users/@me"
      idAttribute: id
      scopes: ["identify", "email"]
      isCreationAllowed: true
      isLinkingAllowed: true
      isAutoCreation: false
      isAutoUpdate: false
      usePkce: true
    zitadel_api_label: "create idp {{ zitadel_discord_idp_name }}"
  when: (_zitadel_idp_search.body.result | default([])) | length == 0

- name: Discord IdPを更新 (常時、client_secretローテーション検知はできないため毎回設定値で上書き)
  ansible.builtin.include_tasks: _api_call.yml
  vars:
    zitadel_api_method: PUT
    zitadel_api_path: "/management/v1/idps/oauth/{{ _zitadel_idp_search.body.result[0].id }}"
    zitadel_api_body: *discord_oauth_config
    zitadel_api_label: "update idp {{ zitadel_discord_idp_name }}"
  when: (_zitadel_idp_search.body.result | default([])) | length > 0

- name: Discord IdP投入結果を確認
  ansible.builtin.assert:
    that:
      - zitadel_api_result.status == 200 or zitadel_api_result.body.code | default(0) == 9
    fail_msg: "Discord IdPの投入に失敗しました: {{ zitadel_api_result.status }}"
  no_log: true
