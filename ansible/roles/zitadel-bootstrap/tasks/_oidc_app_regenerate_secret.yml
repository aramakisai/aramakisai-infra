---
- name: "client_secretを再生成: {{ zitadel_app_item.name }}"
  ansible.builtin.include_tasks: _api_call.yml
  vars:
    zitadel_api_method: POST
    zitadel_api_path: "/management/v1/projects/{{ zitadel_project_id }}/apps/{{ _zitadel_app_search.body.result[0].id }}/oidc_config/_generate_client_secret"
    zitadel_api_body: {}
    zitadel_api_label: "regenerate secret {{ zitadel_app_item.name }}"

- name: "client_id/secretをInfisicalへ登録: {{ zitadel_app_item.name }}"
  # infisical CLIは値を含む出力を返しうるため必ず/dev/nullへ抑制する
  ansible.builtin.shell: >-
    infisical secrets set --env=prod
    {{ zitadel_app_item.infisical_keys.client_id }}="$CLIENT_ID"
    {{ zitadel_app_item.infisical_keys.client_secret }}="$CLIENT_SECRET" >/dev/null 2>&1
  args:
    chdir: "{{ playbook_dir }}/../.."
  environment:
    CLIENT_ID: "{{ _zitadel_app_search.body.result[0].oidcConfig.clientId }}"
    CLIENT_SECRET: "{{ zitadel_api_result.body.clientSecret }}"
  no_log: true
  delegate_to: localhost
