---
# project role `admin`(旧authentik管理者グループ相当)保持者 = Zitadel IAM_OWNER。
#
# Zitadelのproject roleはRP向けclaimでしかなく、Console/Admin APIの権限(instance member)
# とは連動しない。role付与だけでは管理者がConsoleで何も操作できないため、human userに
# 限りinstance memberのIAM_OWNERをrole保持状態へ揃える。
#
# 同期はこのタスクの実行時のみ(イベント駆動ではない)。role `admin`を付与/剥奪したら
# `ansible/playbooks/zitadel-admin-iam-owner.yml`を再実行すること。
# machine user(terraform-provider等)と組み込み管理者(zitadel_admin_iam_owner_sync_exclude)は
# 対象外で、そのIAM_OWNERには触れない。
#
# zitadel_admin_iam_owner_sync_apply=false で件数表示のみ(変更なし)。

- name: 必須変数を検証
  ansible.builtin.assert:
    that:
      - zitadel_admin_pat is defined
      - zitadel_admin_pat | length > 0
    fail_msg: >-
      zitadel_admin_pat を解決できませんでした。
      `infisical run --env=prod -- ansible-playbook ...`で実行してください。

- name: リソース定義を読み込み
  ansible.builtin.include_vars: resources.yml

- name: IAM_OWNERに対応するroleキーを宣言から解決
  ansible.builtin.set_fact:
    _iam_owner_role_key: >-
      {{ zitadel_role_bindings | dict2items
         | selectattr('value.zitadel_instance_roles', 'defined')
         | selectattr('value.zitadel_instance_roles', 'contains', 'IAM_OWNER')
         | map(attribute='key') | first }}

- name: role admin保持者を検索
  ansible.builtin.include_tasks: _api_call.yml
  vars:
    zitadel_api_method: POST
    zitadel_api_path: /management/v1/users/grants/_search
    zitadel_api_body:
      query: { offset: "0", limit: 1000 }
      queries:
        - roleKeyQuery: { roleKey: "{{ _iam_owner_role_key }}", method: TEXT_QUERY_METHOD_EQUALS }
    zitadel_api_label: "search admin role grants"

- name: role admin保持者(human)のuserIdを退避
  ansible.builtin.set_fact:
    _admin_grant_status: "{{ zitadel_api_result.status }}"
    _admin_user_ids: >-
      {{ zitadel_api_result.body.result | default([])
         | selectattr('userType', 'equalto', 'TYPE_HUMAN')
         | map(attribute='userId') | unique | list }}
  no_log: true

- name: instance memberを検索
  ansible.builtin.include_tasks: _api_call.yml
  vars:
    zitadel_api_method: POST
    zitadel_api_path: /admin/v1/members/_search
    zitadel_api_body:
      query: { offset: "0", limit: 1000 }
    zitadel_api_label: "search instance members"

- name: 同期対象のinstance member(human、除外対象以外)を退避
  ansible.builtin.set_fact:
    _member_status: "{{ zitadel_api_result.status }}"
    _human_members: >-
      {{ zitadel_api_result.body.result | default([])
         | selectattr('userType', 'equalto', 'TYPE_HUMAN')
         | rejectattr('preferredLoginName', 'in', _excluded_login_names)
         | list }}
  vars:
    _excluded_login_names: >-
      {{ zitadel_api_result.body.result | default([])
         | map(attribute='preferredLoginName')
         | select('match', '^(' ~ (zitadel_admin_iam_owner_sync_exclude | join('|')) ~ ')@')
         | list }}
  no_log: true

- name: 差分を算出
  ansible.builtin.set_fact:
    _to_grant: >-
      {{ _admin_user_ids | reject('in', _human_members
         | selectattr('roles', 'contains', 'IAM_OWNER') | map(attribute='userId') | list) | list }}
    _to_revoke: >-
      {{ _human_members | selectattr('roles', 'contains', 'IAM_OWNER')
         | rejectattr('userId', 'in', _admin_user_ids) | list }}
  no_log: true

- name: 読取結果と差分件数を表示 (件数のみ)
  ansible.builtin.debug:
    msg: >-
      grants_status={{ _admin_grant_status }} members_status={{ _member_status }}
      admin_role_humans={{ _admin_user_ids | length }}
      human_iam_owners={{ _human_members | selectattr('roles', 'contains', 'IAM_OWNER') | list | length }}
      to_grant={{ _to_grant | length }} to_revoke={{ _to_revoke | length }}

- name: 読取が成功したことを検証
  ansible.builtin.assert:
    that:
      - _admin_grant_status | int == 200
      - _member_status | int == 200

- name: IAM_OWNERを同期
  when: zitadel_admin_iam_owner_sync_apply | bool
  block:
    - name: IAM_OWNERを付与 (member未登録なら追加、登録済みならroleを追記)
      ansible.builtin.include_tasks: _api_call.yml
      vars:
        _existing: "{{ _human_members | selectattr('userId', 'equalto', _uid) | list }}"
        zitadel_api_method: "{{ 'PUT' if _existing | length > 0 else 'POST' }}"
        zitadel_api_path: "/admin/v1/members{{ '/' ~ _uid if _existing | length > 0 else '' }}"
        zitadel_api_body: >-
          {{ {'roles': (_existing[0].roles | default([])) + ['IAM_OWNER']} if _existing | length > 0
             else {'userId': _uid, 'roles': ['IAM_OWNER']} }}
        zitadel_api_label: "grant IAM_OWNER"
      loop: "{{ _to_grant }}"
      loop_control:
        loop_var: _uid
        label: "grant"

    - name: IAM_OWNERを剥奪 (他roleが残るならroleのみ外し、なければmemberごと削除)
      ansible.builtin.include_tasks: _api_call.yml
      vars:
        _rest: "{{ _member.roles | reject('equalto', 'IAM_OWNER') | list }}"
        zitadel_api_method: "{{ 'PUT' if _rest | length > 0 else 'DELETE' }}"
        zitadel_api_path: "/admin/v1/members/{{ _member.userId }}"
        zitadel_api_body: "{{ {'roles': _rest} if _rest | length > 0 else none }}"
        zitadel_api_label: "revoke IAM_OWNER"
      loop: "{{ _to_revoke }}"
      loop_control:
        loop_var: _member
        label: "revoke"

    # API応答が200でもprojection側で反映されない事例(SMTP設定更新)があったため、
    # 応答コードではなく再取得した実状態で判定する
    - name: 反映後のinstance memberを再取得
      ansible.builtin.include_tasks: _api_call.yml
      vars:
        zitadel_api_method: POST
        zitadel_api_path: /admin/v1/members/_search
        zitadel_api_body:
          query: { offset: "0", limit: 1000 }
        zitadel_api_label: "re-search instance members"
      when: (_to_grant | length + _to_revoke | length) > 0

    - name: IAM_OWNERを持つhuman user集合がrole admin保持者と一致することを検証
      ansible.builtin.assert:
        that:
          - _owner_ids | sort == _admin_user_ids | sort
        fail_msg: >-
          IAM_OWNER(human)={{ _owner_ids | length }}件、role admin保持者={{ _admin_user_ids | length }}件で一致しません
        quiet: true
      vars:
        _owner_ids: >-
          {{ zitadel_api_result.body.result | default([])
             | selectattr('userType', 'equalto', 'TYPE_HUMAN')
             | selectattr('roles', 'contains', 'IAM_OWNER')
             | rejectattr('preferredLoginName', 'match', '^(' ~ (zitadel_admin_iam_owner_sync_exclude | join('|')) ~ ')@')
             | map(attribute='userId') | list }}
      when: (_to_grant | length + _to_revoke | length) > 0
