---
# Label Policy (旧terraform/zitadel_branding.tf、task10.7)。
#
# Label Policyはインスタンス/組織に必ず1つデフォルトが存在するため(project等と異なり
# 「存在しない」状態がない)、検索して作成/更新を分岐する必要はない。GETして差分があれば
# PUTするのみ。ロゴ/アイコンの再アップロードは同一内容なら再実行してもchangeDate/
# sequenceが変化しないこと(=冪等)をk3d実機で確認済み。フォント(Requirement 17.3)は
# task10.7の実機検証で512KB上限に阻まれ適用見送り済みのため対象外(zitadel_branding.tf
# 削除時のコメントを踏襲)。
- name: Label Policyを取得
  ansible.builtin.include_tasks: _api_call.yml
  vars:
    zitadel_api_method: GET
    zitadel_api_path: /management/v1/policies/label
    zitadel_api_label: "get label policy"

- name: Label Policy取得結果を退避
  ansible.builtin.set_fact:
    _zitadel_label_policy: "{{ zitadel_api_result.body.policy | default({}) }}"
  no_log: true

- name: Label Policyを更新
  ansible.builtin.include_tasks: _api_call.yml
  vars:
    zitadel_api_method: PUT
    zitadel_api_path: /management/v1/policies/label
    zitadel_api_body:
      primaryColor: "{{ zitadel_label_policy.primary_color }}"
      backgroundColor: "{{ zitadel_label_policy.background_color }}"
      warnColor: "{{ zitadel_label_policy.warn_color }}"
      fontColor: "{{ zitadel_label_policy.font_color }}"
      primaryColorDark: "{{ zitadel_label_policy.primary_color_dark }}"
      backgroundColorDark: "{{ zitadel_label_policy.background_color_dark }}"
      warnColorDark: "{{ zitadel_label_policy.warn_color_dark }}"
      fontColorDark: "{{ zitadel_label_policy.font_color_dark }}"
      themeMode: "{{ zitadel_label_policy.theme_mode }}"
      disableWatermark: "{{ zitadel_label_policy.disable_watermark }}"
      hideLoginNameSuffix: "{{ zitadel_label_policy.hide_login_name_suffix }}"
    zitadel_api_label: "update label policy"
  when: >-
    _zitadel_label_policy.primaryColor | default('') != zitadel_label_policy.primary_color
    or _zitadel_label_policy.backgroundColor | default('') != zitadel_label_policy.background_color
    or _zitadel_label_policy.warnColor | default('') != zitadel_label_policy.warn_color
    or _zitadel_label_policy.fontColor | default('') != zitadel_label_policy.font_color
    or _zitadel_label_policy.themeMode | default('') != zitadel_label_policy.theme_mode
    or _zitadel_label_policy.disableWatermark | default(false) != zitadel_label_policy.disable_watermark

- name: Label Policy更新結果を確認 (No Changesは許容)
  ansible.builtin.assert:
    that:
      - zitadel_api_result.status == 200 or zitadel_api_result.body.code | default(0) == 9
    fail_msg: "label policyの更新に失敗しました: {{ zitadel_api_result.status }}"
  when: >-
    _zitadel_label_policy.primaryColor | default('') != zitadel_label_policy.primary_color
    or _zitadel_label_policy.backgroundColor | default('') != zitadel_label_policy.background_color
    or _zitadel_label_policy.warnColor | default('') != zitadel_label_policy.warn_color
    or _zitadel_label_policy.fontColor | default('') != zitadel_label_policy.font_color
    or _zitadel_label_policy.themeMode | default('') != zitadel_label_policy.theme_mode
    or _zitadel_label_policy.disableWatermark | default(false) != zitadel_label_policy.disable_watermark
  no_log: true

- name: ロゴ/アイコンをアップロード
  ansible.builtin.include_tasks: _label_policy_asset.yml
  loop:
    - { path: "{{ zitadel_branding_logo_light }}", api: /assets/v1/org/policy/label/logo }
    - { path: "{{ zitadel_branding_logo_dark }}", api: /assets/v1/org/policy/label/logo/dark }
    - { path: "{{ zitadel_branding_favicon }}", api: /assets/v1/org/policy/label/icon }
    - { path: "{{ zitadel_branding_favicon }}", api: /assets/v1/org/policy/label/icon/dark }
  loop_control:
    loop_var: zitadel_asset_item
    label: "{{ zitadel_asset_item.api }}"

- name: Label Policyをactivate (draftのままではログイン画面へ反映されないため毎回実行、activate済みの場合は無害)
  ansible.builtin.include_tasks: _api_call.yml
  vars:
    zitadel_api_method: POST
    zitadel_api_path: /management/v1/policies/label/_activate
    zitadel_api_label: "activate label policy"
