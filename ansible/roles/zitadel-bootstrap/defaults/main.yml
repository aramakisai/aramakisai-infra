---
# infisical-auth Secretと同じ位置づけの、ArgoCD/Terraformが自己参照できない
# 領域への例外的初期化ロール。k3d検証環境・本番prod-node-1の両対応。

zitadel_bootstrap_namespace: zitadel
zitadel_bootstrap_pod: zitadel-0
zitadel_bootstrap_zitadel_container: zitadel
zitadel_bootstrap_login_container: login   # zitadelコンテナはshellを持たないdistroless系イメージのため、
                                            # 同一Pod内でshellを持つloginコンテナ経由で共有volumeを読む

# PATの取得元 (StatefulSetのZITADEL_FIRSTINSTANCE_PATPATHと一致させること)
zitadel_bootstrap_pat_path_in_pod: /zitadel-data/zitadel-admin-sa.pat

# 発行されたPATの保存先 (ローカルファイル、本番Infisicalへは登録しない)
zitadel_bootstrap_output_dir: "{{ lookup('env', 'ZITADEL_BOOTSTRAP_OUTPUT_DIR') | default(playbook_dir ~ '/../../.zitadel-poc-secrets', true) }}"
zitadel_bootstrap_pat_output_file: "{{ zitadel_bootstrap_output_dir }}/zitadel-admin-sa.pat"

# k3d検証クラスタ専用のkubeconfigパスを明示指定した場合はそれを使う (ambientな
# `kubectl config current-context` には絶対に依存しない、誤って別クラスタを
# 操作する事故を防ぐため)。未指定時は本番想定とし、`make kubectl`と同じ方式で
# Infisicalの`KUBECONFIG`シークレット(内容そのもの)をファイルへ書き出して使う
# (tasks/main.ymlで生成、zitadel_bootstrap_materialized_kubeconfig参照)。
zitadel_bootstrap_kubeconfig_override: "{{ lookup('env', 'ZITADEL_POC_KUBECONFIG') }}"
zitadel_bootstrap_materialized_kubeconfig: "{{ zitadel_bootstrap_output_dir }}/kubeconfig"
zitadel_bootstrap_kubeconfig: "{{ zitadel_bootstrap_kubeconfig_override if zitadel_bootstrap_kubeconfig_override | length > 0 else zitadel_bootstrap_materialized_kubeconfig }}"

zitadel_bootstrap_ready_retries: 30
zitadel_bootstrap_ready_delay: 5

# ============================================================
# project/role/application/action等のリソース投入 (tasks/resources.yml)
# ============================================================
#
# v2 Management API(HTTP/JSON)へのkubectl exec経由アクセス。design.md
# 「Zitadel Provider Access Path」の到達経路(a)(既存PAT回収と同じPod内実行方式)。
#
# ZITADEL_EXTERNALDOMAINと一致させること(k3d: zitadel.zitadel.svc.cluster.local、
# 本番: idp.aramakisai.com)。Pod自身への接続は常にloopback(127.0.0.1:8080)だが、
# ZitadelはHostヘッダでインスタンスを解決するためこの値のみが実質的な切替対象になる。
zitadel_external_domain: "{{ lookup('env', 'ZITADEL_EXTERNAL_DOMAIN') | default('zitadel.zitadel.svc.cluster.local', true) }}"

# admin machine user(terraform-provider, IAM_OWNER)のPAT。本番は
# `infisical run --env=prod -- ansible-playbook ...`実行時にTF_VAR_zitadel_tokenとして
# 注入される値を再利用する(Terraform provider向けに発行済みのPATをAnsible用に
# 新規発行し直さない)。k3d検証時はzitadel_bootstrap_pat_output_fileから読む。
zitadel_admin_pat: "{{ lookup('env', 'TF_VAR_zitadel_token') | default(lookup('file', zitadel_bootstrap_pat_output_file), true) }}"

# StatefulSetのZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAMEと一致させること
zitadel_login_client_user_name: login-client

# 出展団体CSV (旧terraform/zitadel_student_exhibitor.tfのcsvdecode元と同一内容。
# Terraform管理から外れたためrole内files/へ移設した)
zitadel_student_exhibitor_csv: "{{ role_path }}/files/zitadel_student_exhibitors.csv"

# 新規作成時のみ発行されるclient_secret/PAT平文の保存先 (本番Infisical登録前の一時退避、
# .gitignore対象。既存リソースの更新時はここに何も書き込まれない)
zitadel_resources_output_dir: "{{ zitadel_bootstrap_output_dir }}/resources"

# _admin_iam_owner_sync.yml: role admin保持者とIAM_OWNERの同期から除外するhuman userの
# loginName接頭辞(組み込みの初期管理者はrole adminを持たないためIAM_OWNERを剥奪しない)
zitadel_admin_iam_owner_sync_exclude: [zitadel-admin]
zitadel_admin_iam_owner_sync_apply: true

# _project_role_renames.yml: falseで付け替え対象件数の表示のみ
zitadel_project_role_rename_apply: true
