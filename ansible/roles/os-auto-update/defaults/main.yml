---
# 監視系のDR検知は5分間隔cron+猶予期間10分で最大15分かかって誤検知するため、それより十分離れた深夜早朝の固定時刻にしている
os_auto_update_reboot_time: "03:30"

# server が複数台あるとき全台が同時に再起動すると etcd がクォーラムを失うため、
# inventory 内の順序 (groups['all']) に応じて基準時刻から台数分ずらす。先頭ノードは基準時刻のまま。
# 間隔は 1 台の再起動・k3s の etcd 復帰・Pod 再スケジュールを終えるのに十分な余裕として 30 分
os_auto_update_reboot_stagger_minutes: 30
os_auto_update_host_reboot_time: >-
  {%- set base = os_auto_update_reboot_time.split(':') -%}
  {%- set minutes = (base[0] | int * 60 + base[1] | int
                     + groups['all'].index(inventory_hostname) * os_auto_update_reboot_stagger_minutes | int) % 1440 -%}
  {{ '%02d:%02d' | format(minutes // 60, minutes % 60) }}

# Debian標準のapt-daily-upgrade.timerはデフォルトで毎日06:00頃に起動しランダム遅延も乗るため、それより後の08:00に通知を出す
os_update_notify_timer_hour: 8
os_update_notify_timer_minute: 0

# 呼び出し側でInfisical経由の値を渡す前提
discord_ops_webhook_url: ""
