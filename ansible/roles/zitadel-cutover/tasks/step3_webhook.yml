---
# Step3: vaultwarden-rbac-sync webhook切替 (task4.4で安定と判断された場合のみ)。
#
# task9.2実機検証で判明した既知の制約: Zitadel Actions v2の action_target作成
# (POST /v2/actions/targets)は、cluster-local宛先(RFC1918/.cluster.local)を
# HTTPClient.DenyListにより Errors.Target.DeniedURL (HTTP 400) で拒否する
# (upstream zitadel/zitadel#12326と同種、v4.12.3で実機確認済み)。この制約への
# 対応方針(webhookエンドポイント外部公開 or DenyList緩和)は未決定のため、
# zitadel-resources.yml側はこのエラーを検知した場合、action_target/execution
# 設定をスキップして警告する設計になっている。このため
# zitadel_cutover_include_webhook=true でも、現状は「webhookが実際に機能する
# 状態への切替」までは到達できない。このタスクは現在のaction_target状態を
# 確認し、ブロックされたままであれば警告のみで先へ進む。
- name: "[prod] 適用手順を提示する (このroleはprodへ一切のkubectl/argocdを実行しない)"
  ansible.builtin.debug:
    msg:
      - "前提: Errors.Target.DeniedURL対応方針(webhook外部公開 or ZITADEL_HTTPCLIENT_DENYLIST緩和)がユーザー判断で確定していること。未確定の場合はこのステップを実施せず手動運用へ引き継ぐこと。"
      - "確定している場合、対応方針に応じてgitops/manifests/prod/zitadel/またはvaultwarden-rbac-sync/を変更しPRマージ・ArgoCD syncすること。"
      - "vaultwarden-rbac-sync Deployment の replicas を1へ戻すこと (Vaultwarden本体の凍結解除も別途必要、deployment.yamlコメント参照)。"
      - "infisical run --env=prod -- ansible-playbook ansible/playbooks/zitadel-resources.yml を実行しaction_target/executionを投入すること。"
      - "検証: docs/zitadel-cutover-runbook.md の Step3チェックリストを実施すること。"
  when: zitadel_cutover_target_env == 'prod'

- name: "[k3d] action_targetの現在の状態を確認する"
  ansible.builtin.include_role:
    name: zitadel-bootstrap
    tasks_from: _api_call
  vars:
    zitadel_api_method: POST
    zitadel_api_path: /v2/actions/targets/search
    zitadel_api_body: {}
    zitadel_api_label: "search action targets"
  when: zitadel_cutover_target_env == 'k3d'

- name: "[k3d] vaultwarden-rbac-sync-webhook target有無を確認する"
  ansible.builtin.set_fact:
    _cutover_webhook_target: "{{ zitadel_api_result.body.result | default([]) | selectattr('name', 'equalto', 'vaultwarden-rbac-sync-webhook') | list }}"
  when: zitadel_cutover_target_env == 'k3d'

- name: Step3検証結果 (target未作成、既知のDeniedURL制約)
  ansible.builtin.debug:
    msg: >
      action_target 'vaultwarden-rbac-sync-webhook' は未作成
      (Errors.Target.DeniedURL制約により、task9.2実装のzitadel-resources.ymlが
      警告付きスキップした状態と一致)。対応方針が決まるまでwebhook連携は
      スコープ外運用のまま。
  when:
    - zitadel_cutover_target_env == 'k3d'
    - (_cutover_webhook_target | length) == 0

- name: Step3検証結果 (target作成済み)
  ansible.builtin.debug:
    msg: "action_target 'vaultwarden-rbac-sync-webhook' は作成済み。DeniedURL制約が解消済みの環境と判断する。"
  when:
    - zitadel_cutover_target_env == 'k3d'
    - (_cutover_webhook_target | length) > 0
