# log_pathをファイルにする(/dev/stderr等、kubectl execの接続元FDへ直結する
# 出力先だと、dovecotの各サブプロセスがそのFDを開いたまま存続し続けるため
# kubectl exec自身がEOFを検知できずハングする。ansible実行時に実機で発覚)。
base_dir = /var/run/dovecot
state_dir = /var/lib/dovecot
log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot.log
protocols =
disable_plaintext_auth = no

passdb {
  driver = lua
  args = file=/etc/dovecot/zitadel-auth.lua blocking=yes
}
userdb {
  driver = lua
  args = file=/etc/dovecot/zitadel-auth.lua blocking=yes
}

service auth {
  unix_listener auth-client {
    mode = 0666
  }
}
