---
# K3s サーバーロール: インストールと初期設定

# 1. 前提パッケージのインストール
- name: 前提パッケージのインストール
  ansible.builtin.apt:
    name:
      - curl
      - open-iscsi   # Longhorn (分散ストレージ) 用
      - nfs-common   # NFS マウント用
    state: present
    update_cache: true
    cache_valid_time: 3600

# 2. K3s 設定ディレクトリを作成
- name: K3s 設定ディレクトリを作成
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0755'

# 3. K3s config.yaml を配置 (インストール前に置くことでインストーラが読み込む)
- name: K3s config.yaml を配置
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0600'
  notify: Restart k3s

# 4. K3s をインストール
# K3S_URL は設定しない: 環境変数に K3S_URL があると K3s インストールスクリプトが
# k3s-agent.service をインストールする (agent モード) ため、server モードにならない。
# join 先の URL は config.yaml の server: キーで指定する。

# 既存クラスタのトークン (常に正) を使う。詳細は token.yml
- name: 使用する K3s サーバートークンを決定
  ansible.builtin.include_tasks: token.yml

- name: K3s の導入済みバージョンを取得
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed_version
  failed_when: false
  changed_when: ansible_check_mode and k3s_version not in k3s_installed_version.stdout | default('')
  check_mode: false

- name: K3s をインストール
  # creates: /usr/local/bin/k3s は使わない。
  # 既にk3sがインストール済みの場合にタスク自体をスキップしてしまい、
  # k3s_versionを変更してもバージョンアップグレードが一切適用されなくなるため。
  # インストーラはバイナリ・systemd unit・env ファイルのハッシュが変わらなければ
  # "No change detected so skipping service start" を出して再起動しない。
  # changed はこの文言の有無で判定する。
  ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_TOKEN: "{{ k3s_effective_token }}"
  register: k3s_install_result
  until: k3s_install_result is succeeded
  retries: 3
  delay: 10
  changed_when: "'No change detected so skipping service start' not in k3s_install_result.stdout"

# 5. config.yaml の変更を K3s に反映させる (wait_for より前にハンドラーを実行)
- name: ハンドラーを即時実行 (config 変更を反映)
  ansible.builtin.meta: flush_handlers

# 6. K3s サービスが起動するまで待機
- name: K3s サービスが起動するまで待機 (port 6443)
  ansible.builtin.wait_for:
    port: 6443
    host: "{{ ansible_host }}"
    timeout: 180
    state: started
    delay: 10
