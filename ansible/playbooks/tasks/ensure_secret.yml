---
# bootstrap Secret を「無い/空のときだけ」作成する。
# 入力 env が空のまま上書きして ESO・ArgoCD が全停止した事故があるため、既存の非空値は
# rotate_bootstrap_secrets=true の明示指定がない限り保持する。
#
# 入力:
#   bs_name / bs_namespace  対象 Secret
#   bs_data                 キー -> 値 (全キーを非空必須とする)
#   bs_hint                 入力が空のときにエラーへ出す env 名
#   bs_labels               付与するラベル (任意)
#   bs_dry                  true なら検査のみ (クラスタ未構築でも事前検査できるようにする)
- name: "{{ bs_name }}: 既存 Secret の非空キーを取得"
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - secret
      - "{{ bs_name }}"
      - -n
      - "{{ bs_namespace }}"
      - -o
      - "go-template={% raw %}{{range $k,$v := .data}}{{if $v}}{{$k}} {{end}}{{end}}{% endraw %}"
  register: bs_probe
  failed_when: false
  changed_when: false
  check_mode: false

- name: "{{ bs_name }}: 取得失敗が NotFound 以外なら中断"
  ansible.builtin.fail:
    msg: "{{ bs_name }} の存在確認に失敗: {{ bs_probe.stderr | default(bs_probe.msg | default('')) }}"
  when:
    - not bs_dry
    - bs_probe.rc != 0
    - "'NotFound' not in (bs_probe.stderr | default(''))"

- name: "{{ bs_name }}: 書き込み要否を判定"
  ansible.builtin.set_fact:
    bs_present: "{{ bs_probe.rc == 0 and (bs_data.keys() | difference((bs_probe.stdout | default('')).split()) | length == 0) }}"
    bs_empty_inputs: "{{ bs_data | dict2items | selectattr('value', 'match', '^\\s*$') | map(attribute='key') | list }}"
  no_log: true

- name: "{{ bs_name }}: 書き込み対象のとき入力が揃っていることを検査"
  ansible.builtin.assert:
    that: bs_empty_inputs | length == 0
    fail_msg: >-
      {{ bs_name }} が未作成または空で、入力 ({{ bs_hint }}) も空のため作成できません。
      infisical run 配下で実行してください。
    quiet: true
  when: (rotate_bootstrap_secrets | default(false) | bool) or not bs_present

- name: "{{ bs_name }}: 作成・更新"
  # 値はシェル文字列へ埋め込まず environment 経由で渡す (ps への露出とクォート崩れの回避)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl create secret generic {{ bs_name | quote }} -n {{ bs_namespace | quote }} \
      {% for k in bs_data.keys() %}
        --from-literal={{ k }}="$SV_{{ k }}" \
      {% endfor %}
        --dry-run=client -o yaml \
      {% if bs_labels | default({}) | length > 0 %}
        | kubectl label --local -f - {% for k, v in bs_labels.items() %}{{ k }}={{ v }} {% endfor %}-o yaml \
      {% endif %}
        | kubectl apply -f -
    executable: /bin/bash
  environment: "{{ dict(bs_data.keys() | map('regex_replace', '^', 'SV_') | zip(bs_data.values())) }}"
  when:
    - not bs_dry
    - (rotate_bootstrap_secrets | default(false) | bool) or not bs_present
  no_log: true

- name: "{{ bs_name }}: 作成が必要な状態 (check mode のみ表示)"
  ansible.builtin.debug:
    msg: "{{ bs_name }} は未作成または空のため作成されます"
  when:
    - ansible_check_mode
    - not bs_dry
    - (rotate_bootstrap_secrets | default(false) | bool) or not bs_present
  changed_when: true
