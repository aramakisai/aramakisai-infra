---
# K3s クラスタ全体のブートストラップ Playbook。稼働中クラスタに対して全ホスト・無引数で
# 再実行でき、差分があるものだけを適用する (2 回目の実行は changed=0)。
# 実行順序:
#   pre. 入力 (env / Git チェックアウト / 既存トークン / bootstrap Secret) の事前検査
#   0. 全ノードに swap ファイルを作成 (ホスト側プロセスの OOM 安全弁) ・OS自動更新設定 (unattended-upgrades)
#   1. cp-node に K3s を --cluster-init でインストール (etcd 初期化)
#   2. prod-node-1/2 に K3s をローリングでインストール (etcd 参加 + ワークロード)
#   3. Cilium をインストール (flannel-backend: none のため CNI が必須 / ノードを Ready にする)
#   4. cloudflared を事前インストール (ArgoCD への外部アクセス経路を確保)
#   5. kubeconfig を Infisical に登録
#   6. ArgoCD をインストール・App of Apps を適用
#
# bootstrap Secret (cloudflared-token / infisical-auth / aramakisai-infra-repo) は
# 既存の非空値を保持する。上書きするときだけ -e rotate_bootstrap_secrets=true を付ける。


# ============================================================
# 事前検査: 何かを変更する前に、入力の不足と古いチェックアウトからの適用を止める
# ============================================================
- name: 事前検査 (制御ノード)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../.."
    git_applied_paths:
      - gitops/manifests/prod/cloudflared
      - gitops/root.yaml
  tasks:
    - name: infisical run 配下で実行されていることを確認
      # DISCORD_OPS_WEBHOOK_URL は os-auto-update が必須とする値で、Infisical 経由の
      # 注入有無の目印を兼ねる。KUBECONFIG の差分判定も注入された値に依存する
      ansible.builtin.assert:
        that: lookup('env', 'DISCORD_OPS_WEBHOOK_URL') | length > 0
        fail_msg: DISCORD_OPS_WEBHOOK_URL が空です。infisical run --env=prod -- ansible-playbook ... で実行してください。
        quiet: true

    - name: origin/main を取得
      ansible.builtin.command:
        argv: [git, -C, "{{ repo_root }}", fetch, --quiet, origin, main]
      changed_when: false
      check_mode: false

    - name: チェックアウトの HEAD と origin/main を取得
      ansible.builtin.command:
        argv: [git, -C, "{{ repo_root }}", rev-parse, HEAD, FETCH_HEAD]
      register: git_revs
      changed_when: false
      check_mode: false

    - name: 適用元マニフェストの未コミット変更を取得
      ansible.builtin.command:
        argv: "{{ ['git', '-C', repo_root, 'status', '--porcelain', '--untracked-files=all', '--'] + git_applied_paths }}"
      register: git_dirty
      changed_when: false
      check_mode: false

    - name: 制御ノードのチェックアウトが origin/main と一致することを確認
      # gitops/ を本番へ直接 apply するため、古いブランチや手元の変更で本番を巻き戻さない
      ansible.builtin.assert:
        that:
          - git_revs.stdout_lines[0] == git_revs.stdout_lines[1]
          - git_dirty.stdout | length == 0
        fail_msg: >-
          HEAD が origin/main と一致しないか、{{ git_applied_paths | join(', ') }} に未コミット変更があります。
          main をチェックアウトして実行してください。
        quiet: true


- name: 事前検査 (K3s トークン)
  hosts: all
  become: true
  any_errors_fatal: true
  tasks:
    - name: 既存トークンまたは K3S_TOKEN が利用できることを確認
      ansible.builtin.include_role:
        name: k3s-server
        tasks_from: token.yml


- name: 事前検査 (bootstrap Secret の入力)
  hosts: k3s_server
  run_once: true
  become: true
  vars:
    bootstrap_secrets:
      - name: cloudflared-token
        namespace: cloudflared
        data:
          token: "{{ lookup('env', 'CLOUDFLARE_TUNNEL_TOKEN') }}"
        hint: CLOUDFLARE_TUNNEL_TOKEN
      - name: infisical-auth
        namespace: argocd
        data:
          clientId: "{{ lookup('env', 'INFISICAL_CLIENT_ID') }}"
          clientSecret: "{{ lookup('env', 'INFISICAL_CLIENT_SECRET') }}"
        hint: INFISICAL_CLIENT_ID / INFISICAL_CLIENT_SECRET
      - name: aramakisai-infra-repo
        namespace: argocd
        data:
          type: git
          url: git@github.com:aramakisai/aramakisai-infra.git
          sshPrivateKey: "{{ lookup('env', 'ARGOCD_GITHUB_DEPLOY_KEY') }}"
        hint: ARGOCD_GITHUB_DEPLOY_KEY
  tasks:
    - name: Secret ごとに入力を検査
      ansible.builtin.include_tasks: tasks/ensure_secret.yml
      vars:
        bs_name: "{{ item.name }}"
        bs_namespace: "{{ item.namespace }}"
        bs_data: "{{ item.data }}"
        bs_hint: "{{ item.hint }}"
        bs_dry: true
      loop: "{{ bootstrap_secrets }}"
      loop_control:
        label: "{{ item.name }}"


# ============================================================
# Play 0: swap ファイル作成・OS自動更新設定 (全ノード共通)
# K3s インストール前に行う: kubelet-arg fail-swap-on=false を config.yaml に
# 設定済みでも、swap が無効な状態で K3s が先に起動していると反映には再起動が要る。
# 先に swap を有効化しておけば K3s は最初から swap 前提で起動する。
# ============================================================
- name: ホストの swap ファイル作成・OS自動更新設定
  hosts: all
  become: true
  vars:
    discord_ops_webhook_url: "{{ lookup('env', 'DISCORD_OPS_WEBHOOK_URL') }}"
  roles:
    - role: swap
    - role: os-auto-update


# ============================================================
# Play 1: K3s クラスタ初期化 (cp-node)
# ============================================================
- name: K3s server (cluster-init) のセットアップ
  hosts: k3s_server
  become: true
  roles:
    - role: k3s-server


# ============================================================
# Play 2: K3s server+worker ノード (prod-node-1/2) のセットアップ
# ============================================================
- name: K3s server+worker のセットアップ
  hosts: k3s_server_worker
  become: true
  serial: 1          # ローリングアップデート: 1台ずつ順番に処理
  roles:
    - role: k3s-server


# ============================================================
# Play 3: Cilium インストール
# flannel-backend: none のため、K3s は CNI を持たない。
# Cilium がいないとノードが NotReady のままで全 Pod が Pending になる。
# ArgoCD (GitOps) より先に Ansible で直接インストールする。
# ============================================================
- name: Cilium のインストール
  hosts: k3s_server
  run_once: true
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  vars:
    helm_version: v3.22.0
    cilium_version: "1.17.3"
    cilium_values:
      operator:
        replicas: 1
      ipam:
        mode: kubernetes
      kubeProxyReplacement: false
  tasks:
    - name: Helm がインストールされているか確認
      ansible.builtin.command: helm version --short
      register: helm_check
      failed_when: false
      changed_when: ansible_check_mode and helm_check.rc != 0
      check_mode: false

    - name: Helm をインストール
      # main ブランチ参照のスクリプトは中身が変わりうるため、タグとバージョンの両方を固定する
      ansible.builtin.shell: >-
        curl -fsSL https://raw.githubusercontent.com/helm/helm/{{ helm_version }}/scripts/get-helm-3 | bash
      environment:
        DESIRED_VERSION: "{{ helm_version }}"
      when: helm_check.rc != 0

    - name: Cilium の Helm リリース状態を取得
      ansible.builtin.command: helm list -n kube-system --filter '^cilium$' -o json
      register: cilium_list
      changed_when: false
      check_mode: false
      when: helm_check.rc == 0

    - name: Cilium の現在の values を取得
      ansible.builtin.command: helm get values cilium -n kube-system -o json
      register: cilium_current_values
      changed_when: false
      check_mode: false
      when: helm_check.rc == 0 and (cilium_list.stdout | from_json | length) > 0

    - name: Cilium の更新要否を判定
      # chart バージョンと values (helm get values は --set / -f で与えた値のみ) が
      # 一致し deployed のときは helm を実行しない
      ansible.builtin.set_fact:
        cilium_pending: >-
          {{ cilium_current_values.stdout is not defined
             or (cilium_list.stdout | from_json)[0].chart != 'cilium-' ~ cilium_version
             or (cilium_list.stdout | from_json)[0].status != 'deployed'
             or (cilium_current_values.stdout | from_json) != cilium_values }}

    - name: Cilium の差分を表示 (check mode のみ)
      ansible.builtin.debug:
        msg: "Cilium {{ cilium_version }} を適用します"
      when: ansible_check_mode and cilium_pending
      changed_when: true

    - name: Cilium をインストール・更新
      ansible.builtin.command: >-
        helm upgrade --install cilium cilium
        --repo https://helm.cilium.io/
        --version {{ cilium_version }}
        --namespace kube-system
        -f -
        --wait --timeout=300s
      args:
        stdin: "{{ cilium_values | to_json }}"
      when: cilium_pending

    - name: 全ノードが Ready になるまで待機
      ansible.builtin.command: kubectl wait node --all --for=condition=Ready --timeout=120s
      retries: 5
      delay: 10
      register: node_ready_result
      until: node_ready_result.rc == 0
      changed_when: false
      check_mode: false


# ============================================================
# Play 4: cloudflared 事前インストール
# ArgoCD より先にインストールし、外部アクセス経路を確保する
# ============================================================
- name: cloudflared の事前インストール
  hosts: k3s_server
  run_once: true
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  vars:
    # Single Source of Truth: gitops/manifests/prod/cloudflared/ が唯一の定義場所。
    # 事前検査で HEAD == origin/main かつ未コミット変更なしを確認済み
    cloudflared_manifests: |-
      {% for f in query('ansible.builtin.fileglob', playbook_dir ~ '/../../gitops/manifests/prod/cloudflared/*.yaml') | sort -%}
      ---
      {{ lookup('ansible.builtin.file', f) }}
      {% endfor %}
  tasks:
    - name: cloudflared namespace 作成
      ansible.builtin.include_tasks: tasks/ensure_namespace.yml
      vars:
        ns_name: cloudflared

    - name: Cloudflare Tunnel token を Secret として登録
      ansible.builtin.include_tasks: tasks/ensure_secret.yml
      vars:
        bs_name: cloudflared-token
        bs_namespace: cloudflared
        bs_data:
          token: "{{ lookup('env', 'CLOUDFLARE_TUNNEL_TOKEN') }}"
        bs_hint: CLOUDFLARE_TUNNEL_TOKEN
        bs_dry: false

    - name: cloudflared マニフェストを適用
      ansible.builtin.include_tasks: tasks/apply_manifests.yml
      vars:
        am_stdin: "{{ cloudflared_manifests }}"

    - name: cloudflared の rollout 条件を取得
      ansible.builtin.command: >-
        kubectl get deployment cloudflared -n cloudflared
        -o jsonpath='{.status.conditions[?(@.type=="Progressing")].reason}'
      register: cloudflared_progress
      changed_when: false
      check_mode: false

    - name: cloudflared の ProgressDeadlineExceeded 条件をクリア
      # 過去の失敗 rollout に ProgressDeadlineExceeded 条件が残っている場合のみ restart する。
      # apply で spec が変わっていれば新しい rollout が既に開始されているため、
      # この条件のときだけ restart して余分な二重 rollout を防ぐ。
      ansible.builtin.command: kubectl rollout restart deployment/cloudflared -n cloudflared
      when: cloudflared_progress.stdout == 'ProgressDeadlineExceeded'

    - name: cloudflared が Ready になるまで待機
      ansible.builtin.command: >
        kubectl rollout status deployment/cloudflared
        -n cloudflared --timeout=240s
      changed_when: false
      check_mode: false


# ============================================================
# Play 5: kubeconfig を Infisical に登録
# ============================================================
- name: kubeconfig を Infisical に登録
  hosts: k3s_server
  run_once: true
  become: true
  tasks:
    - name: kubeconfig を取得 (メモリ上のみ。cluster-admin 資格情報をディスクに残さない)
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_raw
      no_log: true

    - name: Tailscale 側アドレスに書き換えた kubeconfig を組み立て
      ansible.builtin.set_fact:
        kubeconfig_fetched: >-
          {{ (kubeconfig_raw.content | b64decode)
             | regex_replace('https://127\.0\.0\.1:6443', 'https://' ~ ansible_host ~ ':6443')
             | regex_replace('\n+$', '') }}
        kubeconfig_stored: "{{ lookup('env', 'KUBECONFIG') | regex_replace('\\n+$', '') }}"
      no_log: true

    - name: Infisical の登録値との差分を判定
      # 登録済みの値は infisical run により $KUBECONFIG に注入される。
      # CI の machine identity は prod シークレットに対し読み取り専用のため、
      # 一致するときは書き込まない (書き込むと 403 で落ちる)
      ansible.builtin.set_fact:
        kubeconfig_pending: "{{ kubeconfig_fetched != kubeconfig_stored }}"

    - name: kubeconfig の差分を表示 (check mode のみ)
      ansible.builtin.debug:
        msg: >-
          kubeconfig を Infisical に登録します
          (stored={{ kubeconfig_stored | hash('sha256') | truncate(12, True, '') }}
          fetched={{ kubeconfig_fetched | hash('sha256') | truncate(12, True, '') }})
      when: ansible_check_mode and kubeconfig_pending
      changed_when: true

    - name: kubeconfig を Infisical に登録 (Single Source of Truth)
      delegate_to: localhost
      become: false
      # no_log は使わない。値は stdin でしか渡らず argv にも環境変数にも載らない。
      # 逆に no_log で全出力を隠すと Infisical 側の API エラーが一切読めず障害調査が不能になる。
      # secrets set は --file が .yaml 拡張子のときだけ YAML として読む (複数行の値を渡せる)。
      # --file は machine identity (--token) 経路でも有効で、KEY=@file は人間ログイン経路でしか
      # 展開されないため、拡張子付きの symlink 経由で stdin を読ませる。
      ansible.builtin.shell:
        cmd: |
          set -u
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          ln -s /dev/stdin "$d/kubeconfig.yaml"
          # CI環境(INFISICAL_CLIENT_ID/SECRETが設定済み)はUniversal Authでトークンを取得して使う。
          # ローカル実行時は対話ログイン済みセッションをそのまま使う。
          # トークンとクライアント資格情報は argv ではなく環境変数で渡す。
          if [ -n "${INFISICAL_CLIENT_ID:-}" ] && [ -n "${INFISICAL_CLIENT_SECRET:-}" ]; then
            INFISICAL_TOKEN=$(INFISICAL_UNIVERSAL_AUTH_CLIENT_ID="$INFISICAL_CLIENT_ID" \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET="$INFISICAL_CLIENT_SECRET" \
              infisical login --method=universal-auth --silent --plain </dev/null)
            export INFISICAL_TOKEN
          fi
          rc=0
          infisical secrets set --env=prod --file="$d/kubeconfig.yaml" >/dev/null 2>"$d/err" || rc=$?
          # stderr には値が混じりうるため、値を含まないと分かっている API エラー行だけを通す。
          grep -a -E -i 'status-code|request-id|message=|unsuccessful|unauthor|forbidden|not found|denied|permission' "$d/err" | head -5 >&2 || true
          exit $rc
        executable: /bin/bash
        stdin: "{{ {'KUBECONFIG': kubeconfig_fetched} | to_json }}"
      when: kubeconfig_pending


# ============================================================
# Play 6: ArgoCD の初期 bootstrap
# ============================================================
- name: ArgoCD の初期 bootstrap
  hosts: k3s_server
  run_once: true
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  vars:
    # stable は移動タグのため再実行ごとに無意識アップグレードされる。
    # 2026-06-19: stable 経由で v3.4.4 に上がり configmap informer のラベル要件変更で
    # argocd-cm/argocd-rbac-cm が見えなくなり全コンポーネントが crash した実績あり
    argocd_version: v3.4.4
    root_manifest: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../gitops/root.yaml') }}"
  tasks:
    - name: ArgoCD namespace 作成
      ansible.builtin.include_tasks: tasks/ensure_namespace.yml
      vars:
        ns_name: argocd

    - name: 稼働中の ArgoCD のイメージを取得
      ansible.builtin.command: >-
        kubectl get deployment argocd-server -n argocd
        -o jsonpath='{.spec.template.spec.containers[0].image}'
      register: argocd_running_image
      failed_when: argocd_running_image.rc != 0 and 'NotFound' not in argocd_running_image.stderr
      changed_when: false
      check_mode: false

    - name: 稼働中の ArgoCD が固定バージョンより新しければ中断 (ダウングレード防止)
      ansible.builtin.assert:
        that: >-
          argocd_running_tag is not match('^v[0-9]+\.[0-9]+\.[0-9]+$')
          or (argocd_running_tag | regex_replace('^v') is version(argocd_version | regex_replace('^v'), '<='))
        fail_msg: >-
          稼働中の ArgoCD ({{ argocd_running_tag }}) が固定バージョン {{ argocd_version }} より新しいため、
          ダウングレードを避けて中断します。argocd_version を稼働中以上に更新してください。
        quiet: true
      vars:
        argocd_running_tag: "{{ argocd_running_image.stdout.rsplit(':', 1)[-1] }}"
      when: argocd_running_image.rc == 0

    - name: ArgoCD インストール
      # --server-side: ArgoCD の CRD が大きく last-applied-configuration アノテーションが
      # 262144 バイト制限を超えるため、Server-Side Apply を使用する。
      # field manager は既存の ownership を引き継ぐため kubectl のまま (初回 client-side apply
      # との競合は force-conflicts で解消する)
      ansible.builtin.include_tasks: tasks/apply_manifests.yml
      vars:
        am_source: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml"
        am_namespace: argocd
        am_field_manager: kubectl

    - name: ArgoCD が Ready になるまで待機
      ansible.builtin.command: >-
        kubectl rollout status deployment/argocd-server
        -n argocd --timeout=300s
      changed_when: false
      check_mode: false

    - name: infisical-auth Secret を作成 (ESO を経由しない唯一の Secret)
      # この Secret だけは ESO を経由せず直接作成する。
      # ClusterSecretStore (universalAuthCredentials) に合わせて
      # clientId / clientSecret キーで登録する (serviceToken 形式ではない)
      ansible.builtin.include_tasks: tasks/ensure_secret.yml
      vars:
        bs_name: infisical-auth
        bs_namespace: argocd
        bs_data:
          clientId: "{{ lookup('env', 'INFISICAL_CLIENT_ID') }}"
          clientSecret: "{{ lookup('env', 'INFISICAL_CLIENT_SECRET') }}"
        bs_hint: INFISICAL_CLIENT_ID / INFISICAL_CLIENT_SECRET
        bs_dry: false

    - name: GitHub Deploy Key を ArgoCD Repository Secret として登録
      # プライベートリポジトリへのアクセスに必要。秘密鍵は Infisical の
      # ARGOCD_GITHUB_DEPLOY_KEY に保存する。root.yaml は SSH URL
      # (git@github.com:aramakisai/aramakisai-infra.git) を使うこと
      ansible.builtin.include_tasks: tasks/ensure_secret.yml
      vars:
        bs_name: aramakisai-infra-repo
        bs_namespace: argocd
        bs_data:
          type: git
          url: git@github.com:aramakisai/aramakisai-infra.git
          sshPrivateKey: "{{ lookup('env', 'ARGOCD_GITHUB_DEPLOY_KEY') }}"
        bs_labels:
          argocd.argoproj.io/secret-type: repository
        bs_hint: ARGOCD_GITHUB_DEPLOY_KEY
        bs_dry: false

    - name: App of Apps (root.yaml) を適用
      # 適用後は ArgoCD が自律的に sync を開始:
      #   wave: -1  ESO (Helm Chart) + ClusterSecretStore
      #   wave: 0   Directus, mailserver, cloudflared (adopt), ...
      # cloudflared は既に稼働しているため ArgoCD が同名リソースを adopt する
      ansible.builtin.include_tasks: tasks/apply_manifests.yml
      vars:
        am_stdin: "{{ root_manifest }}"
        am_namespace: argocd
