---
# Payload CMS のシークレット (ESO)
# wave: 0 — cms (wave 1) の PreSync Job がこの Secret を参照して起動するため、
# cms 本体とは別 Application に分けて先に同期させる。
# 同じ Application に置くと PreSync フックが Sync フェーズの生成物を待つ形になり進まない
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cms-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:aramakisai/aramakisai-infra.git
    targetRevision: main
    path: gitops/manifests/prod/cms-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
