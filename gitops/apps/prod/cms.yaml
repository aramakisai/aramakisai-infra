---
# Payload CMS
# wave: 1 — cms-secrets (wave 0) の Secret が揃ってから本体を同期する。
# payload ロールは本 Application 内の db-cluster.yaml (sync-wave -1) の
# managed.roles が作るため、PreSync の cms-db-init より必ず先に適用される
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cms
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:aramakisai/aramakisai-infra.git
    targetRevision: main
    path: gitops/manifests/prod/cms
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # RespectIgnoreDifferences は配列要素パスの ignore と併用すると、apply 時に配列が live の長さに
      # 丸められ追加要素が落ちるため付けない
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
