---
# intrusion-response ワークフローの本番動作確認用 (一時リソース)。
# Namespace を管理対象に含めているため、この Application を Git から消すと
# root の prune → finalizer で namespace ごと削除される (CreateNamespace=true だと namespace が残る)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ir-drill
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:aramakisai/aramakisai-infra.git
    targetRevision: main
    path: gitops/manifests/prod/ir-drill
  destination:
    server: https://kubernetes.default.svc
    namespace: ir-drill
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
