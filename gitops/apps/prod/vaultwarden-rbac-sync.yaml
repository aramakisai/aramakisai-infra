---
# Vaultwarden RBAC Sync — Zitadel Project Role(user_grant) → Vaultwarden Collection権限の自動同期
# (Actions v2 webhook常駐受信、旧authentikポーリング方式は idp-migration-zitadel task 4で置換)
# wave: 0
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden-rbac-sync
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:aramakisai/aramakisai-infra.git
    targetRevision: main
    path: gitops/manifests/prod/vaultwarden-rbac-sync
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
