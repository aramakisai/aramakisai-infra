---
# Netdata Cloud child agent — btop相当の即時可視化 (軽量メトリクス監視)
# wave: 0
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netdata
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://netdata.github.io/helmchart
    chart: netdata
    targetRevision: "3.7.175"
    helm:
      valuesObject:
        parent:
          enabled: false
        k8sState:
          enabled: false
        child:
          enabled: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 512Mi
          configs:
            netdata:
              enabled: true
              path: /etc/netdata/netdata.conf
              data: |
                [db]
                  db = dbengine
                [directories]
                  # 既定の /var/cache/netdata はコンテナ内の書き込み層でコンテナ再作成時に消える。
                  # chart が hostPath で永続化しているのは /var/lib/netdata 配下だけ。
                  cache = /var/lib/netdata/cache
                [plugins]
                  # 閲覧専用の child では不要で、メモリを消費するか毎分エラーを出すため無効化する。
                  netflow = no
                  scripts.d = no
                  network-viewer = no
                [web]
                  bind to = localhost:19999
                [health]
                  enabled = no
                [ml]
                  enabled = no
          claiming:
            enabled: true
            url: "https://api.netdata.cloud"
            # token/rooms は平文記載しない (envFrom で Secret から注入する)
          envFrom:
            - secretRef:
                name: netdata-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
