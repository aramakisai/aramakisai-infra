---
# Zitadel — Identity Provider (authentikの後継、PoC)
# wave: 0 — ESO/CNPG Operator が揃った後にデプロイ
#
# syncPolicy.automatedは付けない(手動sync)。本番Zitadelの起動・Ansibleブートストラップ
# (PAT発行)・Terraform apply(project/application再現)が完了し実機で疎通確認できるまでの
# 間は、mainへの他の変更に巻き込まれて意図せずsyncされることを避けるため。
# task9.4(RP側OIDC Client切替、別PR)着手前に本Applicationがhealthy/syncedであることを
# 確認した上でautomatedへ切り替える判断を行う。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zitadel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:aramakisai/aramakisai-infra.git
    targetRevision: main
    path: gitops/manifests/prod/zitadel
  destination:
    server: https://kubernetes.default.svc
    namespace: zitadel
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
