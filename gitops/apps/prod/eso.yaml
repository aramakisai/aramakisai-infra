---
# External Secrets Operator (ESO)
# wave: -1 — 他の全アプリより先に sync し、CRD (ExternalSecret, ClusterSecretStore 等) を提供する
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # external-secrets.io/v1 CRD は ESO 0.16 系から提供される。
    # 0.15 以前は v1alpha1/v1beta1 のみで、v1 を使う manifest を同期できない
    # (2026-08-12: argocd-config が同期失敗し ArgoCD の OIDC ログインが無効化された)。
    targetRevision: "0.16.*"
    helm:
      valuesObject:
        installCRDs: true
        replicaCount: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
