---
# Falcosidekick が config.existingSecret として envFrom で読み込むSecret
# DISCORD_OPS_WEBHOOK_URL は Falcosidekick/Healthchecks.io/dr-trigger で共有するWebhook
# WEBHOOK_CUSTOMHEADERS は ops-dashboard collector への転送用 (Falcosidekick の書式は key:value のカンマ区切り)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falcosidekick-secrets
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: falcosidekick-secrets
    creationPolicy: Owner
    template:
      data:
        DISCORD_WEBHOOKURL: "{{ .discordWebhookUrl }}"
        WEBHOOK_CUSTOMHEADERS: "Authorization:Bearer {{ .opsFalcoWebhookToken }}"
  data:
    - secretKey: discordWebhookUrl
      remoteRef:
        key: DISCORD_OPS_WEBHOOK_URL
    - secretKey: opsFalcoWebhookToken
      remoteRef:
        key: OPS_FALCO_WEBHOOK_TOKEN
