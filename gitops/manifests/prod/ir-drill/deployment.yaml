---
# 何もしない待機 Pod。forensics のログ採取と隔離 NetworkPolicy の対象になるだけ。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idle
  namespace: ir-drill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idle
  template:
    metadata:
      labels:
        app: idle
    spec:
      automountServiceAccountToken: false
      containers:
        - name: idle
          image: alpine/k8s:1.37.1
          command:
            - sh
            - -c
            - echo ir-drill idle; exec sleep infinity
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
