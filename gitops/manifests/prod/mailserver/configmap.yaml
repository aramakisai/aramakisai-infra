---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mailserver-config
  namespace: prod
data:
  # Postfix 設定オーバーライド:
  # virtual_mailbox_domains から LDAP lookup を除外 (query_filter が空で Operations error になるため)
  # /etc/postfix/vhost に aramakisai.com が静的に書かれているのでそれだけで十分
  postfix-main.cf: |
    virtual_mailbox_domains = /etc/postfix/vhost
  # Zitadel Lua Auth Bridge passdb (旧auth-ldap.conf.ext の passdb を置き換え):
  # mechanisms = plain login により、OAUTHBEARER では lua を試みない
  # (OAUTHBEARER の場合は下の oauth2 passdb のみを使用する)。
  # userdbはmailAlias等のLDAP動的属性に依存していなかった実質static値だったため、
  # LDAP問い合わせをやめて直接staticへ置き換える(uid/gid/homeの値は既存
  # DOVECOT_USER_ATTRS と同一)。mail/acl_groups はzitadel-auth.luaのpassdb extra field
  # (userdb_mail/userdb_acl_groups)がログイン時にここへ上書きマージされる
  # (design.md「一般IMAP/POP3クライアント認証フロー」参照)。
  auth-zitadel.conf.ext: |
    passdb {
      driver = lua
      args = file=/etc/dovecot/lua/zitadel-auth.lua blocking=yes
      mechanisms = plain login
      result_failure = continue
      result_internalfail = continue
    }
    # allow_all_users=yes: static userdbは既定でpassdb成功済みユーザーのみ解決する
    # (Dovecot仕様)。IMAP/POP3ログインはlua passdbが必ず先に成功するため無関係だが、
    # LMTPローカル配送(ML宛メール)はSASL認証を伴わずuserdbのみ参照するため、
    # このフラグがないと"Auth USER lookup failed"で全ML宛配送が失敗する
    # (task10.4のk3d実機検証で発覚)。
    userdb {
      driver = static
      args = uid=5000 gid=5000 home=/var/mail/aramakisai.com/%n mail=maildir:/var/mail/aramakisai.com/%n allow_all_users=yes
    }
  # メーリングリストDovecot完結化 (task10.4, Requirement 15):
  # ML主アドレス8件(pr/planning/accounting/booth/stage/admin/general-affairs/noreply)は
  # 上のauth-zitadel.conf.ext静的userdb(home=...%n)がテンプレート展開で汎用的に解決するため
  # 追加設定不要。admin@の5エイリアス(postmastar@/webmastar@/abuse@/administrator@/www@)のみ、
  # 局所部と同名のディレクトリが存在しないためadmin@のMaildirへ明示的に解決するpasswd-file
  # driver userdbが別途必要 (authentik_mailing_lists.tfのmailAlias相当をDovecot側で完結)。
  # auth-*.conf.extという名前はDovecot標準include(10-auth.confの!include auth-*.conf.ext)の
  # globパターンに必須。userdbは定義順に検索されるため、辞書順で上の汎用フォールバック
  # (auth-zitadel.conf.ext)より先に読み込まれる名前(auth-ml-userdb < auth-zitadel)にし、
  # エイリアス一致を優先させる。
  auth-ml-userdb.conf.ext: |
    userdb {
      driver = passwd-file
      args = /etc/dovecot/ml-aliases
    }
  # admin@の5エイリアスをadmin@自身のMaildirへ直接解決するpasswd-fileデータ。
  # mailを明示上書きしないと、userdbが見つからない場合のグローバルmail_locationの
  # テンプレート展開(%u)でエイリアス自身の局所部ディレクトリ(存在しない)を見に行ってしまう。
  ml-aliases: |
    postmastar:x:5000:5000::/var/mail/aramakisai.com/admin::mail=maildir:/var/mail/aramakisai.com/admin
    webmastar:x:5000:5000::/var/mail/aramakisai.com/admin::mail=maildir:/var/mail/aramakisai.com/admin
    abuse:x:5000:5000::/var/mail/aramakisai.com/admin::mail=maildir:/var/mail/aramakisai.com/admin
    administrator:x:5000:5000::/var/mail/aramakisai.com/admin::mail=maildir:/var/mail/aramakisai.com/admin
    www:x:5000:5000::/var/mail/aramakisai.com/admin::mail=maildir:/var/mail/aramakisai.com/admin
  # Dovecot ACL plugin の有効化 (mail_plugins への acl 追加):
  # DMS の dovecot.cf 相当 (下の dovecot.cf キー) は /etc/dovecot/local.conf として
  # !include conf.d/*.conf の後に読み込まれる。一方 conf.d/15-lda.conf や
  # conf.d/20-imap.conf は protocol lda/imap { mail_plugins = $mail_plugins } を
  # 既に明示宣言しており、Dovecotはその時点の(acl追加前の)グローバル値で確定させてしまうため、
  # local.conf側でグローバルmail_pluginsを変更してもIMAP/LDA向けには反映されない
  # (doveconf -nで実機確認済み、protocol imap側が空のまま)。
  # そのため、acl追加分のみ conf.d/*.conf より前に読まれるファイル名 (05-) で別途注入する。
  05-acl-plugin.conf: |
    mail_plugins = $mail_plugins acl
  # Dovecot 認証設定オーバーライド
  dovecot.cf: |
    auth_mechanisms = plain login oauthbearer xoauth2

    # OAUTHBEARER: Authentik introspection endpoint でトークン検証 (ファイル参照)
    passdb {
      driver = oauth2
      mechanisms = oauthbearer xoauth2
      args = /etc/dovecot/dovecot-oauth2.conf.ext
    }

    plugin {
      acl = vfile
      # acl_shared_dict: Dovecot が共有メールボックスの ACL 情報をキャッシュするための辞書。
      # 設定しないと "Mailbox not found from dovecot-acl-list" エラーが発生し、
      # 共有メールボックスが LIST に表示されない (acl_lookup_dict not enabled)。
      # /var/mail/aramakisai.com/ は docker:docker (0777) 所有で書込可能。
      acl_shared_dict = file:/var/mail/aramakisai.com/.acl_shared_dict
    }

    # 既定の inbox (private) namespace は separator 未指定で Maildir 既定の '.' を使う。
    # 一方で下の shared namespace 群は separator = '/' を指定しているため、
    # Dovecot の "All list=yes namespaces must use the same separator" 制約に抵触し、
    # 共有メールボックスへのアクセス・doveadm mailbox 操作が一切できない (タスク3.2で発覚)。
    # inbox namespace の separator も '/' に揃えて解消する (既存個人メールボックスはネスト
    # フォルダを持たないフラット構成のため、IMAP 区切り文字変更の影響は無い)。
    namespace inbox {
      inbox = yes
      separator = /
    }

    # ML 7件分の共有メールボックスを静的に定義する (acl_shared_dict は不使用、件数固定のため)
    # INDEX は /var/indexes ではなく /var/mail/.indexes 配下に置く: /var はルート所有 (0755) で
    # dovecot 実効 uid 5000 が mkdir できず "Permission denied" で Shared 名前空間が一切開けない
    # (タスク4.1で発覚)。メール PVC のルート /var/mail は 0777 docker 所有で書込可能なため、
    # ここに共有 index を置く。DMS は全ユーザー単一 uid 5000 のため共有 index で問題ない。
    #
    # subscriptions = no + list = children: 共有メールボックスの LIST 可視性を ACL で
    # fail-closed に制御する (Req 2.2)。
    #
    # list = yes は子の有無に関わらず namespace prefix を常に LIST へ出すため、アクセス権の
    # ない部署も \Noselect ノードとして全ユーザーに名前が漏れる (実機確認)。一方 list = children は
    # 「ユーザーが LIST 可能な子メールボックスを持つ namespace のみ表示」する。Dovecot vfile ACL は
    # 子に dovecot-acl が無ければ親 (= 部署ルート) の ACL を継承するため、子メールボックスの可視性も
    # group= マッチ (acl_groups) で決まる。結果:
    #   - 部署メンバー (acl_groups=<dept>): 自部署の子のみ可視 → 自部署のみ LIST に出る
    #   - リーダー (acl_groups=leader,...): 全部署が group=leader を継承するため全部署の子が可視
    #     → 全部署が LIST に出る (実機確認: 会計のみユーザーは pr の子を一切 LIST できない)
    # acl_groups は oauth2 introspection の userdb_acl_groups 経由で注入される
    # (dovecot-oauth2-external-secret.yaml の pass_attrs 参照)。
    #
    # 前提: list = children のゲートには各部署 maildir に最低1つの子メールボックスが必要。
    # 受信専用で一度もクライアント接続していない部署は子が無く LIST に出ないため、
    # acl-postsync-job.yaml が全部署に標準サブフォルダ (Drafts/Sent/Junk/Trash) を冪等作成する。
    # 部署受信トレイ (maildir ルート) は "Shared/<dept>" 自体を SELECT してアクセスする。
    # subscriptions = no は Roundcube 側 imap_force_list=true で補い、購読不要で表示させる。
    namespace {
      type = shared
      separator = /
      prefix = Shared/planning/
      location = maildir:/var/mail/aramakisai.com/planning:INDEX=/var/mail/.indexes/aramakisai.com/planning
      subscriptions = no
      list = children
    }
    namespace {
      type = shared
      separator = /
      prefix = Shared/accounting/
      location = maildir:/var/mail/aramakisai.com/accounting:INDEX=/var/mail/.indexes/aramakisai.com/accounting
      subscriptions = no
      list = children
    }
    namespace {
      type = shared
      separator = /
      prefix = Shared/booth/
      location = maildir:/var/mail/aramakisai.com/booth:INDEX=/var/mail/.indexes/aramakisai.com/booth
      subscriptions = no
      list = children
    }
    namespace {
      type = shared
      separator = /
      prefix = Shared/stage/
      location = maildir:/var/mail/aramakisai.com/stage:INDEX=/var/mail/.indexes/aramakisai.com/stage
      subscriptions = no
      list = children
    }
    namespace {
      type = shared
      separator = /
      prefix = Shared/pr/
      location = maildir:/var/mail/aramakisai.com/pr:INDEX=/var/mail/.indexes/aramakisai.com/pr
      subscriptions = no
      list = children
    }
    namespace {
      type = shared
      separator = /
      prefix = Shared/admin/
      location = maildir:/var/mail/aramakisai.com/admin:INDEX=/var/mail/.indexes/aramakisai.com/admin
      subscriptions = no
      list = children
    }
    namespace {
      type = shared
      separator = /
      prefix = Shared/general-affairs/
      location = maildir:/var/mail/aramakisai.com/general-affairs:INDEX=/var/mail/.indexes/aramakisai.com/general-affairs
      subscriptions = no
      list = children
    }
    namespace {
      type = shared
      separator = /
      prefix = Shared/noreply/
      location = maildir:/var/mail/aramakisai.com/noreply:INDEX=/var/mail/.indexes/aramakisai.com/noreply
      subscriptions = no
      list = children
    }
  # Postfix LDAP グループマップ オーバーライド (メーリングリスト用):
  # DMS が自動生成する ldap-groups.cf は result_attribute=mail のみのため、
  # マッチしたグループ自身の mail (= 検索キーと同じ) が返るだけでメンバーに展開されない。
  # special_result_attribute=member でメンバー DN を取得し、leaf_result_attribute=mail で
  # 各メンバーの mail 属性に展開する。result_attribute は空にすることで、
  # マッチしたグループ自身の mail (検索キーと同一アドレス) が結果に混入し
  # 「グループ自身宛の配送が宛先不明でバウンスする」問題を回避する。
  # timeout=30: special_result_attribute による複数回の LDAP ラウンドトリップが
  # デフォルトの 10 秒を超えることがあり、"map lookup problem ... try again later"
  # でメッセージが受理されず消失することがあるため延長する。
  # bind/bind_dn/bind_pw/query_filter/search_base/server_host/start_tls/version は
  # LDAP_* 環境変数から _replace_by_env_in_file により自動置換される (DMS ldap.sh)。
  ldap-groups.cf: |
    bind = yes
    bind_dn =
    bind_pw =
    query_filter =
    result_attribute =
    leaf_result_attribute = mail
    search_base =
    server_host =
    special_result_attribute = member
    start_tls = no
    timeout = 30
    version = 3
  # 送信者なりすまし防止 (LDAP_QUERY_FILTER_SENDERS / SPOOF_PROTECTION 用) の最終ファイルを
  # DMS公式の拡張フック (user-patches.sh、_setup完了後に実行) で生成する。
  # DMSのldap.shは/tmp/docker-mailserver/ldap-{users,groups,aliases,domains}.cfのみを
  # /etc/postfix/へコピーする実装でsendersは対象外、かつ/etc/postfix/ldap-senders.cfへの
  # 直接マウントもConfigMapボリュームがread-onlyのため後続のldap.shによる
  # _replace_by_env_in_file (sed -i) が失敗する (いずれも実機確認済み、
  # research.md「Phase 0実装時の発見」参照)。そのため _setup 完了後に呼ばれる
  # user-patches.sh で、ldap-groups.cf と同じ member 展開パターン
  # (special_result_attribute=member / leaf_result_attribute=mail / timeout=30) を持つ
  # ldap-senders.cf を直接生成する。mailListMigrated の値は一切参照しないため、
  # fan-out の移行状態に関係なく全MLで送信制限が機能する。
  user-patches.sh: |
    #!/bin/bash
    cat > /etc/postfix/ldap-senders.cf <<INNEREOF
    bind = yes
    bind_dn = ${LDAP_BIND_DN}
    bind_pw = ${LDAP_BIND_PW}
    query_filter = ${LDAP_QUERY_FILTER_SENDERS}
    result_attribute =
    leaf_result_attribute = mail
    search_base = ${LDAP_SEARCH_BASE}
    server_host = ${LDAP_SERVER_HOST}
    special_result_attribute = member
    start_tls = no
    timeout = 30
    version = 3
    INNEREOF
  # OpenDKIM KeyTable/SigningTable/TrustedHosts:
  # `setup config dkim domain` はこれらを /tmp/docker-mailserver/opendkim/ 配下に
  # 生成するが、その場所はConfigMap/Secretマウントではなく実行時の一時領域のため
  # Pod再作成のたびに失われる (dkim-keys Secret でマウントしているのは keys/ 配下の
  # 秘密鍵のみで、この3ファイルは対象外だった)。mail-tester.com でのDKIM未署名検知
  # (2026-07-03) で発覚。3ファイルとも秘匿情報を含まないためConfigMapで宣言的に永続化する。
  opendkim-keytable: |
    mail._domainkey.aramakisai.com aramakisai.com:mail:/etc/opendkim/keys/aramakisai.com/mail.private
  opendkim-signingtable: |
    *@aramakisai.com mail._domainkey.aramakisai.com
  opendkim-trustedhosts: |
    127.0.0.1
    localhost
    aramakisai.com
  # rspamd リソース削減:
  # メール流量がほぼ皆無(0.2 msg/sec)のため、rspamd_proxy worker の並列数を
  # 既定の2から1へ削減 (プロセスあたり約140MiBのメモリ削減)。
  # controller worker (管理UI/統計API、port 11334) も未使用のため無効化。
  # 副作用: Dovecot Sieveのlearn_spam/learn_ham (メールをJunkへ移動した際の
  # ベイズ学習フィードバック) は内部的にcontrollerのrspamc APIを叩くため、
  # 無効化に伴い学習フィードバックは効かなくなる (フィルタ自体は動作継続)。
  rspamd-worker-proxy.inc: |
    count = 1;
  rspamd-worker-controller.inc: |
    enabled = false;
  # Dovecot Lua Auth Bridge: IMAP/POP3認証をZitadel Session APIへ都度委譲する
  # (design.md「Dovecot Lua Auth Bridge」節、k3d実機検証済み)。
  json.lua: |
    -- 依存追加を避けるための最小限の自作JSON encode/decode。
    -- encodeは正規のエスケープ処理を行う(制御文字・"・\を全てエスケープする、文字列連結による
    -- 組み立てを禁止するtask 3.1の要件を満たすため、パスワード等の値は必ずこの関数を経由させる)。
    local json = {}

    local escape_map = {
      ['"'] = '\\"',
      ['\\'] = '\\\\',
      ['\n'] = '\\n',
      ['\r'] = '\\r',
      ['\t'] = '\\t',
      ['\b'] = '\\b',
      ['\f'] = '\\f',
    }

    local function escape_string(s)
      local out = s:gsub('[%z\1-\31\\"]', function(c)
        return escape_map[c] or string.format('\\u%04x', string.byte(c))
      end)
      return '"' .. out .. '"'
    end

    local encode_value

    local function encode_array(t)
      local parts = {}
      for i = 1, #t do
        parts[i] = encode_value(t[i])
      end
      return '[' .. table.concat(parts, ',') .. ']'
    end

    local function is_array(t)
      local n = 0
      for _ in pairs(t) do n = n + 1 end
      return n == #t
    end

    local function encode_object(t)
      local parts = {}
      for k, v in pairs(t) do
        parts[#parts + 1] = escape_string(tostring(k)) .. ':' .. encode_value(v)
      end
      return '{' .. table.concat(parts, ',') .. '}'
    end

    encode_value = function(v)
      local t = type(v)
      if t == 'string' then
        return escape_string(v)
      elseif t == 'number' then
        return tostring(v)
      elseif t == 'boolean' then
        return v and 'true' or 'false'
      elseif t == 'nil' then
        return 'null'
      elseif t == 'table' then
        if next(v) == nil then
          return '{}'
        elseif is_array(v) then
          return encode_array(v)
        else
          return encode_object(v)
        end
      end
      error('json.encode: unsupported type ' .. t)
    end

    function json.encode(v)
      return encode_value(v)
    end

    -- decodeはZitadel APIレスポンス(オブジェクト/配列/文字列/数値/真偽値/null)を読める
    -- 範囲の最小実装。
    local decode_value

    local function skip_ws(s, i)
      local _, e = s:find('^[ \t\n\r]*', i)
      return e + 1
    end

    local function decode_string(s, i)
      -- 先頭の " は呼び出し元で確認済み
      local j = i + 1
      local out = {}
      while true do
        local c = s:sub(j, j)
        if c == '' then
          error('json.decode: unterminated string')
        elseif c == '"' then
          return table.concat(out), j + 1
        elseif c == '\\' then
          local n = s:sub(j + 1, j + 1)
          if n == 'n' then out[#out + 1] = '\n'
          elseif n == 't' then out[#out + 1] = '\t'
          elseif n == 'r' then out[#out + 1] = '\r'
          elseif n == 'b' then out[#out + 1] = '\b'
          elseif n == 'f' then out[#out + 1] = '\f'
          elseif n == '"' then out[#out + 1] = '"'
          elseif n == '\\' then out[#out + 1] = '\\'
          elseif n == '/' then out[#out + 1] = '/'
          elseif n == 'u' then
            local hex = s:sub(j + 2, j + 5)
            local code = tonumber(hex, 16) or 0
            if code < 0x80 then
              out[#out + 1] = string.char(code)
            else
              -- BMP範囲のみ簡易UTF-8変換(Zitadelレスポンス中のASCII外文字は主にメッセージ文字列のみ)
              out[#out + 1] = utf8 and utf8.char(code) or '?'
            end
            j = j + 4
          else
            out[#out + 1] = n
          end
          j = j + 2
        else
          out[#out + 1] = c
          j = j + 1
        end
      end
    end

    decode_value = function(s, i)
      i = skip_ws(s, i)
      local c = s:sub(i, i)
      if c == '"' then
        return decode_string(s, i)
      elseif c == '{' then
        local obj = {}
        i = skip_ws(s, i + 1)
        if s:sub(i, i) == '}' then return obj, i + 1 end
        while true do
          i = skip_ws(s, i)
          local key
          key, i = decode_string(s, i)
          i = skip_ws(s, i)
          if s:sub(i, i) ~= ':' then error('json.decode: expected :') end
          local val
          val, i = decode_value(s, i + 1)
          obj[key] = val
          i = skip_ws(s, i)
          local d = s:sub(i, i)
          if d == ',' then
            i = i + 1
          elseif d == '}' then
            return obj, i + 1
          else
            error('json.decode: expected , or }')
          end
        end
      elseif c == '[' then
        local arr = {}
        i = skip_ws(s, i + 1)
        if s:sub(i, i) == ']' then return arr, i + 1 end
        while true do
          local val
          val, i = decode_value(s, i)
          arr[#arr + 1] = val
          i = skip_ws(s, i)
          local d = s:sub(i, i)
          if d == ',' then
            i = i + 1
          elseif d == ']' then
            return arr, i + 1
          else
            error('json.decode: expected , or ]')
          end
        end
      elseif s:sub(i, i + 3) == 'true' then
        return true, i + 4
      elseif s:sub(i, i + 4) == 'false' then
        return false, i + 5
      elseif s:sub(i, i + 3) == 'null' then
        return nil, i + 4
      else
        local numstr = s:match('^-?%d+%.?%d*[eE]?[-+]?%d*', i)
        if numstr and #numstr > 0 then
          return tonumber(numstr), i + #numstr
        end
        error('json.decode: unexpected character at ' .. i .. ': ' .. c)
      end
    end

    function json.decode(s)
      local ok, v = pcall(function()
        local val = decode_value(s, 1)
        return val
      end)
      if not ok then
        return nil, v
      end
      return v
    end

    return json
  zitadel-auth.lua: |
    -- Dovecot Lua Auth Bridge: IMAP/POP3認証をZitadel Session API(POST /v2/sessions)へ
    -- 都度委譲する。パスワードは一切永続化しない(design.md「メール認証」参照)。
    --
    -- 設定は環境変数ではなくファイル経由で読む: dovecot-lua auth-lua driverはプロセス起動時の
    -- 環境変数を子プロセスへ渡さない実装のため(doveconf -aで確認済み)、PATはSecretマウントの
    -- ファイルパスから都度読む。

    package.path = package.path .. ';/etc/dovecot/lua/?.lua'
    local json = require('json')

    local ZITADEL_BASE_URL = 'http://zitadel.zitadel.svc.cluster.local:8080'
    local PAT_FILE = '/etc/dovecot/zitadel.pat'

    local http_client = dovecot.http.client {
      timeout = 5000;
      connect_timeout_msecs = 3000;
      max_attempts = 1; -- リトライで複数回パスワード試行を消費させない(brute-force lockout対策と整合)
      debug = false;
    }

    local function read_pat()
      local f = assert(io.open(PAT_FILE, 'r'))
      local pat = f:read('*a')
      f:close()
      return (pat:gsub('%s+$', ''))
    end

    local ZITADEL_PAT = read_pat()

    -- HTTPレスポンスstatus()がHTTP応答以外(接続エラー等)の場合、Dovecot Lua HTTPクライアントは
    -- 非HTTPな内部エラーコードを返す(公式ドキュメント参照)。100未満はHTTPステータスとして
    -- 有効ではないため、タイムアウト/接続失敗とみなす。
    local function is_transport_failure(status)
      return status == nil or status < 100
    end

    -- task 3.2: Session成功後にManagement APIでuser_grant(ロール)を取得し、
    -- mail属性・ACLグループへマッピングする。Zitadelのproject role割り当てを唯一の
    -- 真実源泉とし、Dovecot側に独立した第二のグループ台帳を持たせない。
    local function fetch_acl(login_name)
      local body = json.encode({
        queries = { { userNameQuery = { userName = login_name } } },
      })
      local req = http_client:request {
        url = ZITADEL_BASE_URL .. '/management/v1/users/grants/_search';
        method = 'POST';
      }
      req:add_header('Authorization', 'Bearer ' .. ZITADEL_PAT)
      req:add_header('Content-Type', 'application/json')
      req:set_payload(body)
      local resp = req:submit()
      local status = resp:status()

      if is_transport_failure(status) or status >= 500 then
        return nil, true -- transport_failure=true
      end
      if status ~= 200 then
        return nil, false
      end

      local ok, decoded = pcall(json.decode, resp:payload())
      if not ok or not decoded then
        return nil, false
      end

      local result = decoded.result
      if not result or #result == 0 then
        -- ロール未付与ユーザーのログイン自体は妨げない(design.md方針)。ACLグループなしで返す。
        return { mail = login_name, acl_groups = '' }, false
      end

      local grant = result[1]
      local role_keys = grant.roleKeys or {}
      return {
        mail = grant.email or login_name,
        acl_groups = table.concat(role_keys, ','),
      }, false
    end

    function auth_passdb_lookup(req)
      local body = json.encode({
        checks = {
          user = { loginName = req.user },
          password = { password = req.password },
        },
      })

      local http_req = http_client:request {
        url = ZITADEL_BASE_URL .. '/v2/sessions';
        method = 'POST';
      }
      http_req:add_header('Authorization', 'Bearer ' .. ZITADEL_PAT)
      http_req:add_header('Content-Type', 'application/json')
      http_req:set_payload(body)

      local resp = http_req:submit()
      local status = resp:status()

      -- task 3.3: タイムアウト・5xxはDovecot標準の一時エラーとして扱い、認証失敗と区別する。
      -- クライアント側の誤ったパスワード変更試行を誘発しない。
      if is_transport_failure(status) or status >= 500 then
        req:log_error('zitadel-auth: session API unreachable/5xx: ' .. tostring(resp:reason()))
        return dovecot.auth.PASSDB_RESULT_INTERNAL_FAILURE, ''
      end

      if status ~= 200 and status ~= 201 then
        -- 401/400(パスワード誤り)・404(該当ユーザーなし)を区別せず一律PASSWORD_MISMATCHとして
        -- 扱う(ユーザー列挙耐性、Requirement 9.2と同じ方針をDovecot側にも適用する)。
        return dovecot.auth.PASSDB_RESULT_PASSWORD_MISMATCH, ''
      end

      local acl, transport_failure = fetch_acl(req.user)
      if transport_failure then
        req:log_error('zitadel-auth: user grant lookup unreachable/5xx')
        return dovecot.auth.PASSDB_RESULT_INTERNAL_FAILURE, ''
      end
      acl = acl or { mail = req.user, acl_groups = '' }

      -- パスワードは既にZitadel Session APIで検証済みのため、Dovecot側での再照合は不要
      -- (nopassword=yでDovecotへ明示する。password=""を返すと空文字列との照合を試みて
      -- 必ずpassword_mismatchになる)。
      return dovecot.auth.PASSDB_RESULT_OK, {
        nopassword = 'y',
        userdb_mail = acl.mail,
        userdb_acl_groups = acl.acl_groups,
      }
    end
