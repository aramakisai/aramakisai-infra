---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mailserver-config
  namespace: prod
data:
  # Postfix 設定オーバーライド:
  # virtual_mailbox_domains から LDAP lookup を除外 (query_filter が空で Operations error になるため)
  # /etc/postfix/vhost に aramakisai.com が静的に書かれているのでそれだけで十分
  postfix-main.cf: |
    virtual_mailbox_domains = /etc/postfix/vhost
  # 一般IMAP/POP3クライアント認証 (plain/login) の passdb/userdb オーバーライド:
  # mechanisms = plain login により、OAUTHBEARER ではこちらを試みない。
  # OAUTHBEARER (Roundcube) の場合は oauth2 passdb のみを使用する。
  #
  # authentikからZitadel Session APIへの認証委譲 (design.md「Dovecot Lua Auth
  # Bridge」) に伴い driver を lua へ変更した。ファイル名 auth-ldap.conf.ext は
  # 据え置く: DMS (docker-mailserver) は DOVECOT_USER_FILTER/DOVECOT_PASS_FILTER
  # からこの同名パスへ自前のLDAP passdb/userdbを自動生成するため、別名にすると
  # DMS生成分とこのlua版の両方がconf.d/*.confとして同時ロードされ、複数passdbが
  # 直列に試行される事故(意図しないLDAP認証の残存)になる。同名を維持することで
  # このマウントがDMS生成分を確実に上書きする(オリジナルのLDAP版で確立済みの
  # 挙動を踏襲、実docker-mailserverでの二重ロード有無は未検証のためファイル名は
  # 変更しないことでリスクを避けた)。
  #
  # Postfixのメールボックス存在確認・MLグループ展開 (このファイル内の
  # LDAP_QUERY_FILTER_* / ldap-groups.cf) は本切替のスコープ外で、引き続き
  # authentik-ldap-outpostへのLDAPを使用する(design.md Requirement 15、別タスク)。
  auth-ldap.conf.ext: |
    passdb {
      driver = lua
      args = file=/etc/dovecot/zitadel-auth.lua blocking=yes
      mechanisms = plain login
      result_failure = continue
      result_internalfail = continue
    }
    userdb {
      driver = lua
      args = file=/etc/dovecot/zitadel-auth.lua blocking=yes
    }
  # 上記passdb/userdbが呼び出すLuaスクリプト本体
  # (ansible/roles/zitadel-cutover/templates/zitadel-auth.lua.j2 のレンダリング結果、
  # dovecot-lua-2.3.21.1 + lua5.3-socket + lua5.3-cjson で実機検証済み)。
  zitadel-auth.lua: |
    -- Dovecot Lua Auth Bridge: passdb/userdb driver for Zitadel Session API
    --
    -- passdb は auth_passdb_lookup (lookup方式) を使う。Zitadel Session API側で
    -- 平文パスワードの検証が完結するため、Dovecotには独自のパスワードスキーム比較を
    -- させない ("nopassword=y" を返す。付けないとDovecotがpassword=フィールドを
    -- 要求しPASSDB_RESULT_SCHEME_NOT_AVAILABLEで失敗する。dovecot-lua-2.3.21.1 +
    -- luasocket + lua5.3-cjsonの組み合わせでk3d実機検証済み)。
    --
    -- この設定はDovecot自身のIMAP/POP3クライアント認証のみを対象とする。
    -- Postfixのメールボックス存在確認・ML展開(LDAP_QUERY_FILTER_*)は本ブリッジの
    -- スコープ外で、引き続きLDAPを使用する(design.md Requirement 15、別タスク)。

    local http = require("socket.http")
    local ltn12 = require("ltn12")
    local cjson = require("cjson.safe")

    -- 環境ごとの値はJinja2レンダリング時に固定する(Dovecotにはenv_設定機構が
    -- 存在せず、import_environmentはDMSの既定env一覧を破壊するリスクがあるため
    -- 採用しなかった。k3d実機でこの2点を確認済み)。
    local ZITADEL_API_BASE_URL = "http://zitadel.zitadel.svc.cluster.local:8080"
    local ZITADEL_EXTERNAL_DOMAIN = "idp.aramakisai.com"
    local PAT_FILE = "/run/secrets/zitadel-dovecot-pat"
    local HTTP_TIMEOUT_SECONDS = 5

    http.TIMEOUT = HTTP_TIMEOUT_SECONDS

    local function read_file(path)
      local f = io.open(path, "r")
      if not f then
        return nil
      end
      local content = f:read("*a")
      f:close()
      if content == nil then
        return nil
      end
      return (content:gsub("%s+$", ""))
    end

    -- auth-workerプロセスは複数リクエストにわたって存続するため、ファイル読み取りは
    -- プロセス起動後1回のみで良い(PATローテーション時はauth-workerの再起動が必要)。
    local cached_pat = nil
    local function get_pat()
      if cached_pat == nil then
        cached_pat = read_file(PAT_FILE)
      end
      return cached_pat
    end

    -- 戻り値: ok(bool), status_code_or_nil, decoded_body_or_error_string
    local function zitadel_api(method, path, body_table)
      local pat = get_pat()
      if pat == nil then
        return false, nil, "pat_unavailable"
      end

      local body = nil
      local headers = {
        ["Host"] = ZITADEL_EXTERNAL_DOMAIN,
        ["Authorization"] = "Bearer " .. pat,
      }
      if body_table ~= nil then
        body = cjson.encode(body_table)
        headers["Content-Type"] = "application/json"
        headers["Content-Length"] = tostring(#body)
      end

      local response_chunks = {}
      local ok, status_or_err = http.request({
        url = ZITADEL_API_BASE_URL .. path,
        method = method,
        headers = headers,
        source = body and ltn12.source.string(body) or nil,
        sink = ltn12.sink.table(response_chunks),
      })

      if ok == nil then
        -- luasocketはネットワーク層の失敗(timeout含む)時に第1戻り値nil、第2戻り値へ
        -- エラー文字列("timeout"等)を返す。HTTPステータスコードとは別系統のため
        -- ここで明確に分岐する(task3.3のフェイルモード要件)。
        return false, nil, tostring(status_or_err)
      end

      local response_body = table.concat(response_chunks)
      local parsed = cjson.decode(response_body)
      return true, status_or_err, parsed
    end

    -- ロール割り当てをacl_groupsへ変換する。project role_keyがそのまま部署名
    -- (dovecot.cfのnamespace prefix、例: planning/accounting/booth/stage/pr/admin/
    -- general_affairs)と一致する設計のため、値の変換テーブルを持たない
    -- (ansible/roles/zitadel-bootstrap/vars/resources.ymlのrole定義と同期させること)。
    local function fetch_acl_groups(user_id)
      local ok, status, parsed = zitadel_api(
        "POST",
        "/management/v1/users/grants/_search",
        { queries = { { userIdQuery = { userId = user_id } } } }
      )
      if not ok or status ~= 200 or parsed == nil or parsed.result == nil then
        return nil
      end
      local groups = {}
      for _, grant in ipairs(parsed.result) do
        for _, role_key in ipairs(grant.roleKeys or {}) do
          table.insert(groups, role_key)
        end
      end
      if #groups == 0 then
        return nil
      end
      return table.concat(groups, ",")
    end

    function auth_passdb_lookup(req)
      local ok, status, parsed = zitadel_api("POST", "/v2/sessions", {
        checks = {
          user = { loginName = req.user },
          password = { password = req.password },
        },
      })

      if not ok then
        req:log_error("zitadel session api unreachable: " .. tostring(parsed))
        return dovecot.auth.PASSDB_RESULT_INTERNAL_FAILURE, "zitadel api unreachable"
      end

      if status == 201 then
        return dovecot.auth.PASSDB_RESULT_OK, "nopassword=y"
      elseif status == 400 then
        -- code=3 "Password is invalid" が実機で確認済みの応答(task7.1参照)
        return dovecot.auth.PASSDB_RESULT_PASSWORD_MISMATCH, "password mismatch"
      elseif status == 404 then
        -- code=5 "User could not be found"。存在しないユーザー名でも誤パスワードと
        -- 同一のPASSWORD_MISMATCHへ正規化し、Dovecotから見て区別不能にする
        -- (task7.1が指摘したユーザー列挙耐性の緩和策を踏襲)。
        return dovecot.auth.PASSDB_RESULT_PASSWORD_MISMATCH, "password mismatch"
      else
        req:log_error("zitadel session api unexpected status " .. tostring(status))
        return dovecot.auth.PASSDB_RESULT_INTERNAL_FAILURE, "unexpected status " .. tostring(status)
      end
    end

    function auth_userdb_lookup(req)
      local ok, status, parsed = zitadel_api(
        "POST",
        "/v2/users",
        { queries = { { loginNameQuery = { loginName = req.user } } } }
      )
      if not ok or status ~= 200 or parsed == nil or parsed.result == nil or #parsed.result == 0 then
        return dovecot.auth.USERDB_RESULT_USER_UNKNOWN, "no such user"
      end

      local user_id = parsed.result[1].userId
      local acl_groups = fetch_acl_groups(user_id)

      local fields = { "uid=5000", "gid=5000", "mail=" .. req.user }
      if acl_groups ~= nil then
        table.insert(fields, "acl_groups=" .. acl_groups)
      end
      return dovecot.auth.USERDB_RESULT_OK, table.concat(fields, " ")
    end
  # Dovecot ACL plugin の有効化 (mail_plugins への acl 追加):
  # DMS の dovecot.cf 相当 (下の dovecot.cf キー) は /etc/dovecot/local.conf として
  # !include conf.d/*.conf の後に読み込まれる。一方 conf.d/15-lda.conf や
  # conf.d/20-imap.conf は protocol lda/imap { mail_plugins = $mail_plugins } を
  # 既に明示宣言しており、Dovecotはその時点の(acl追加前の)グローバル値で確定させてしまうため、
  # local.conf側でグローバルmail_pluginsを変更してもIMAP/LDA向けには反映されない
  # (doveconf -nで実機確認済み、protocol imap側が空のまま)。
  # そのため、acl追加分のみ conf.d/*.conf より前に読まれるファイル名 (05-) で別途注入する。
  05-acl-plugin.conf: |
    mail_plugins = $mail_plugins acl
  # Dovecot 認証設定オーバーライド
  dovecot.cf: |
    auth_mechanisms = plain login oauthbearer xoauth2

    # OAUTHBEARER: Authentik introspection endpoint でトークン検証 (ファイル参照)
    passdb {
      driver = oauth2
      mechanisms = oauthbearer xoauth2
      args = /etc/dovecot/dovecot-oauth2.conf.ext
    }

    plugin {
      acl = vfile
      # acl_shared_dict: Dovecot が共有メールボックスの ACL 情報をキャッシュするための辞書。
      # 設定しないと "Mailbox not found from dovecot-acl-list" エラーが発生し、
      # 共有メールボックスが LIST に表示されない (acl_lookup_dict not enabled)。
      # /var/mail/aramakisai.com/ は docker:docker (0777) 所有で書込可能。
      acl_shared_dict = file:/var/mail/aramakisai.com/.acl_shared_dict
    }

    # 既定の inbox (private) namespace は separator 未指定で Maildir 既定の '.' を使う。
    # 一方で下の shared namespace 群は separator = '/' を指定しているため、
    # Dovecot の "All list=yes namespaces must use the same separator" 制約に抵触し、
    # 共有メールボックスへのアクセス・doveadm mailbox 操作が一切できない (タスク3.2で発覚)。
    # inbox namespace の separator も '/' に揃えて解消する (既存個人メールボックスはネスト
    # フォルダを持たないフラット構成のため、IMAP 区切り文字変更の影響は無い)。
    namespace inbox {
      inbox = yes
      separator = /
    }

    # ML 7件分の共有メールボックスを静的に定義する (acl_shared_dict は不使用、件数固定のため)
    # INDEX は /var/indexes ではなく /var/mail/.indexes 配下に置く: /var はルート所有 (0755) で
    # dovecot 実効 uid 5000 が mkdir できず "Permission denied" で Shared 名前空間が一切開けない
    # (タスク4.1で発覚)。メール PVC のルート /var/mail は 0777 docker 所有で書込可能なため、
    # ここに共有 index を置く。DMS は全ユーザー単一 uid 5000 のため共有 index で問題ない。
    #
    # subscriptions = no + list = children: 共有メールボックスの LIST 可視性を ACL で
    # fail-closed に制御する (Req 2.2)。
    #
    # list = yes は子の有無に関わらず namespace prefix を常に LIST へ出すため、アクセス権の
    # ない部署も \Noselect ノードとして全ユーザーに名前が漏れる (実機確認)。一方 list = children は
    # 「ユーザーが LIST 可能な子メールボックスを持つ namespace のみ表示」する。Dovecot vfile ACL は
    # 子に dovecot-acl が無ければ親 (= 部署ルート) の ACL を継承するため、子メールボックスの可視性も
    # group= マッチ (acl_groups) で決まる。結果:
    #   - 部署メンバー (acl_groups=<dept>): 自部署の子のみ可視 → 自部署のみ LIST に出る
    #   - リーダー (acl_groups=leader,...): 全部署が group=leader を継承するため全部署の子が可視
    #     → 全部署が LIST に出る (実機確認: 会計のみユーザーは pr の子を一切 LIST できない)
    # acl_groups は oauth2 introspection の userdb_acl_groups 経由で注入される
    # (dovecot-oauth2-external-secret.yaml の pass_attrs 参照)。
    #
    # 前提: list = children のゲートには各部署 maildir に最低1つの子メールボックスが必要。
    # 受信専用で一度もクライアント接続していない部署は子が無く LIST に出ないため、
    # acl-postsync-job.yaml が全部署に標準サブフォルダ (Drafts/Sent/Junk/Trash) を冪等作成する。
    # 部署受信トレイ (maildir ルート) は "Shared/<dept>" 自体を SELECT してアクセスする。
    # subscriptions = no は Roundcube 側 imap_force_list=true で補い、購読不要で表示させる。
    namespace {
      type = shared
      separator = /
      prefix = Shared/planning/
      location = maildir:/var/mail/aramakisai.com/planning:INDEX=/var/mail/.indexes/aramakisai.com/planning
      subscriptions = no
      list = children
    }
    namespace {
      type = shared
      separator = /
      prefix = Shared/accounting/
      location = maildir:/var/mail/aramakisai.com/accounting:INDEX=/var/mail/.indexes/aramakisai.com/accounting
      subscriptions = no
      list = children
    }
    namespace {
      type = shared
      separator = /
      prefix = Shared/booth/
      location = maildir:/var/mail/aramakisai.com/booth:INDEX=/var/mail/.indexes/aramakisai.com/booth
      subscriptions = no
      list = children
    }
    namespace {
      type = shared
      separator = /
      prefix = Shared/stage/
      location = maildir:/var/mail/aramakisai.com/stage:INDEX=/var/mail/.indexes/aramakisai.com/stage
      subscriptions = no
      list = children
    }
    namespace {
      type = shared
      separator = /
      prefix = Shared/pr/
      location = maildir:/var/mail/aramakisai.com/pr:INDEX=/var/mail/.indexes/aramakisai.com/pr
      subscriptions = no
      list = children
    }
    namespace {
      type = shared
      separator = /
      prefix = Shared/admin/
      location = maildir:/var/mail/aramakisai.com/admin:INDEX=/var/mail/.indexes/aramakisai.com/admin
      subscriptions = no
      list = children
    }
    namespace {
      type = shared
      separator = /
      prefix = Shared/general-affairs/
      location = maildir:/var/mail/aramakisai.com/general-affairs:INDEX=/var/mail/.indexes/aramakisai.com/general-affairs
      subscriptions = no
      list = children
    }
    namespace {
      type = shared
      separator = /
      prefix = Shared/noreply/
      location = maildir:/var/mail/aramakisai.com/noreply:INDEX=/var/mail/.indexes/aramakisai.com/noreply
      subscriptions = no
      list = children
    }
  # Postfix LDAP グループマップ オーバーライド (メーリングリスト用):
  # DMS が自動生成する ldap-groups.cf は result_attribute=mail のみのため、
  # マッチしたグループ自身の mail (= 検索キーと同じ) が返るだけでメンバーに展開されない。
  # special_result_attribute=member でメンバー DN を取得し、leaf_result_attribute=mail で
  # 各メンバーの mail 属性に展開する。result_attribute は空にすることで、
  # マッチしたグループ自身の mail (検索キーと同一アドレス) が結果に混入し
  # 「グループ自身宛の配送が宛先不明でバウンスする」問題を回避する。
  # timeout=30: special_result_attribute による複数回の LDAP ラウンドトリップが
  # デフォルトの 10 秒を超えることがあり、"map lookup problem ... try again later"
  # でメッセージが受理されず消失することがあるため延長する。
  # bind/bind_dn/bind_pw/query_filter/search_base/server_host/start_tls/version は
  # LDAP_* 環境変数から _replace_by_env_in_file により自動置換される (DMS ldap.sh)。
  ldap-groups.cf: |
    bind = yes
    bind_dn =
    bind_pw =
    query_filter =
    result_attribute =
    leaf_result_attribute = mail
    search_base =
    server_host =
    special_result_attribute = member
    start_tls = no
    timeout = 30
    version = 3
  # 送信者なりすまし防止 (LDAP_QUERY_FILTER_SENDERS / SPOOF_PROTECTION 用) の最終ファイルを
  # DMS公式の拡張フック (user-patches.sh、_setup完了後に実行) で生成する。
  # DMSのldap.shは/tmp/docker-mailserver/ldap-{users,groups,aliases,domains}.cfのみを
  # /etc/postfix/へコピーする実装でsendersは対象外、かつ/etc/postfix/ldap-senders.cfへの
  # 直接マウントもConfigMapボリュームがread-onlyのため後続のldap.shによる
  # _replace_by_env_in_file (sed -i) が失敗する (いずれも実機確認済み、
  # research.md「Phase 0実装時の発見」参照)。そのため _setup 完了後に呼ばれる
  # user-patches.sh で、ldap-groups.cf と同じ member 展開パターン
  # (special_result_attribute=member / leaf_result_attribute=mail / timeout=30) を持つ
  # ldap-senders.cf を直接生成する。mailListMigrated の値は一切参照しないため、
  # fan-out の移行状態に関係なく全MLで送信制限が機能する。
  user-patches.sh: |
    #!/bin/bash
    cat > /etc/postfix/ldap-senders.cf <<INNEREOF
    bind = yes
    bind_dn = ${LDAP_BIND_DN}
    bind_pw = ${LDAP_BIND_PW}
    query_filter = ${LDAP_QUERY_FILTER_SENDERS}
    result_attribute =
    leaf_result_attribute = mail
    search_base = ${LDAP_SEARCH_BASE}
    server_host = ${LDAP_SERVER_HOST}
    special_result_attribute = member
    start_tls = no
    timeout = 30
    version = 3
    INNEREOF
  # OpenDKIM KeyTable/SigningTable/TrustedHosts:
  # `setup config dkim domain` はこれらを /tmp/docker-mailserver/opendkim/ 配下に
  # 生成するが、その場所はConfigMap/Secretマウントではなく実行時の一時領域のため
  # Pod再作成のたびに失われる (dkim-keys Secret でマウントしているのは keys/ 配下の
  # 秘密鍵のみで、この3ファイルは対象外だった)。mail-tester.com でのDKIM未署名検知
  # (2026-07-03) で発覚。3ファイルとも秘匿情報を含まないためConfigMapで宣言的に永続化する。
  opendkim-keytable: |
    mail._domainkey.aramakisai.com aramakisai.com:mail:/etc/opendkim/keys/aramakisai.com/mail.private
  opendkim-signingtable: |
    *@aramakisai.com mail._domainkey.aramakisai.com
  opendkim-trustedhosts: |
    127.0.0.1
    localhost
    aramakisai.com
  # rspamd リソース削減:
  # メール流量がほぼ皆無(0.2 msg/sec)のため、rspamd_proxy worker の並列数を
  # 既定の2から1へ削減 (プロセスあたり約140MiBのメモリ削減)。
  # controller worker (管理UI/統計API、port 11334) も未使用のため無効化。
  # 副作用: Dovecot Sieveのlearn_spam/learn_ham (メールをJunkへ移動した際の
  # ベイズ学習フィードバック) は内部的にcontrollerのrspamc APIを叩くため、
  # 無効化に伴い学習フィードバックは効かなくなる (フィルタ自体は動作継続)。
  rspamd-worker-proxy.inc: |
    count = 1;
  rspamd-worker-controller.inc: |
    enabled = false;
