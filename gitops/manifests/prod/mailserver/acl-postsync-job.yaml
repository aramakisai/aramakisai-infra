---
# Dovecot ACL 更新 PostSync Job
# Zitadel 認証済みの全ユーザーに全 ML 共有メールボックスへの同等アクセス権を与える
# dovecot-acl をメールボックス単位で冪等に書き出す。
# ArgoCD PostSync フックとして実行される。
apiVersion: batch/v1
kind: Job
metadata:
  name: mailserver-acl-update
  namespace: prod
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: prod-node-1
      containers:
        - name: acl-update
          image: mailserver/docker-mailserver:15.1.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              BASE="/var/mail/aramakisai.com"
              # メール実効 UID/GID (Dovecot userdb の uid=5000/gid=5000 と一致)
              MAIL_UID=5000
              MAIL_GID=5000
              for box in planning accounting booth stage pr admin general-affairs; do
                ACL_FILE="$BASE/$box/dovecot-acl"
                # 'a'(ACL管理権)は付けない: 全員が同一権限のため、IMAP SETACL で他ユーザーの
                # アクセスを外せてしまうだけで利点がない
                echo "authenticated lrwstipekx" > "$ACL_FILE"
                chown "$MAIL_UID:$MAIL_GID" "$ACL_FILE"
                echo "[=] Wrote ACL for $box"
                # list = children のゲート用に標準サブフォルダ (子メールボックス) を冪等作成する。
                # 子は dovecot-acl を持たないため部署ルートの ACL を継承する。
                # Maildir++ 形式: .<Folder>/{cur,new,tmp} + maildirfolder 空ファイル。
                # 所有者は Dovecot 実効 UID(5000) にしないと Permission denied で開けない。
                for folder in Drafts Sent Junk Trash; do
                  DIR="$BASE/$box/.$folder"
                  if [ ! -d "$DIR" ]; then
                    mkdir -p "$DIR/cur" "$DIR/new" "$DIR/tmp"
                    touch "$DIR/maildirfolder"
                    chown -R "$MAIL_UID:$MAIL_GID" "$DIR"
                    chmod -R 0700 "$DIR"
                    echo "[+] Created subfolder $box/.$folder"
                  fi
                done
              done
              echo "[*] ACL + subfolder update complete"
          volumeMounts:
            - name: data
              mountPath: /var/mail
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mailserver-data
