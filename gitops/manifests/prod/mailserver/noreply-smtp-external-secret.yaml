---
# noreply@ の SMTP AUTH パスワード。CMS (cms-secrets) と同じ Infisical キーを参照し、
# user-patches.sh が起動時にハッシュ化して Dovecot の passwd-file を生成する。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mailserver-noreply-smtp
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: mailserver-noreply-smtp
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: NOREPLY_SMTP_PASSWORD
