---
# Dovecot oauth2 設定ファイルを Secret として生成する ExternalSecret
# client_secret を含むため ConfigMap ではなく Secret にする
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dovecot-oauth2-config
  namespace: prod
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: dovecot-oauth2-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        dovecot-oauth2.conf.ext: |
          introspection_url = https://idp.aramakisai.com/oauth/v2/introspect
          introspection_mode = post
          client_id = {{ .ROUNDCUBE_OIDC_CLIENT_ID }}
          client_secret = {{ .MAIL_OAUTH2_CLIENT_SECRET }}
          # k3d実機確認済み: introspectionレスポンスは "username" フィールドに
          # loginName(このシステムではメールアドレス形式)を返す。"email" フィールドも
          # 存在するが、emailスコープが許可されなかった場合でもusernameは常に返る
          # ため安全側のusernameを使う。
          username_attribute = username
          active_attribute = active
          active_value = true
          # Zitadelのintrospectionレスポンスにはロール割り当てのクレームが含まれない
          # (project role assertionはid_token/userinfo専用の
          # "urn:zitadel:iam:org:project:roles" クレームであり、introspectionの
          # scopeフィールドには対象projectが定義するroleの一覧が並ぶだけでユーザー
          # 自身への割り当て有無を含まないことをk3d実機で確認済み)。
          # そのためacl_groupsはこのファイルのpass_attrsではなく、Dovecot自身の
          # userdb(zitadel-auth.lua、auth-ldap.conf.ext参照)が都度Management API
          # へ問い合わせて解決する。
  data:
    - secretKey: MAIL_OAUTH2_CLIENT_SECRET
      remoteRef:
        key: MAIL_OAUTH2_CLIENT_SECRET
    - secretKey: ROUNDCUBE_OIDC_CLIENT_ID
      remoteRef:
        key: ROUNDCUBE_OIDC_CLIENT_ID
