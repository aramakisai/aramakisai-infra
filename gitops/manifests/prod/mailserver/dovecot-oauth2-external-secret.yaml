---
# Dovecot oauth2 設定ファイルを Secret として生成する ExternalSecret
# client_secret を含むため ConfigMap ではなく Secret にする
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dovecot-oauth2-config
  namespace: prod
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: dovecot-oauth2-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        dovecot-oauth2.conf.ext: |
          introspection_url = https://idp.aramakisai.com/oauth/v2/introspect
          introspection_mode = post
          client_id = {{ .ROUNDCUBE_OIDC_CLIENT_ID }}
          client_secret = {{ .MAIL_OAUTH2_CLIENT_SECRET }}
          # k3d実機確認済み: introspectionレスポンスは "username" フィールドに
          # loginName(このシステムではメールアドレス形式)を返す。"email" フィールドも
          # 存在するが、emailスコープが許可されなかった場合でもusernameは常に返る
          # ため安全側のusernameを使う。
          username_attribute = username
          active_attribute = active
          active_value = true
  data:
    # authentik時代のMAIL_OAUTH2_CLIENT_SECRETは上書きしない(切り戻し用に温存)ため
    # 別名の_ZITADELサフィックス付きキーから取得する。
    - secretKey: MAIL_OAUTH2_CLIENT_SECRET
      remoteRef:
        key: MAIL_OAUTH2_CLIENT_SECRET_ZITADEL
    - secretKey: ROUNDCUBE_OIDC_CLIENT_ID
      remoteRef:
        key: ROUNDCUBE_OIDC_CLIENT_ID
