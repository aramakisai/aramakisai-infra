---
# Dovecot oauth2 設定ファイルを Secret として生成する ExternalSecret
# client_secret を含むため ConfigMap ではなく Secret にする
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dovecot-oauth2-config
  namespace: prod
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: dovecot-oauth2-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        dovecot-oauth2.conf.ext: |
          # task 3.4: introspection先をAuthentikからZitadelへ切替。
          # ZitadelのOIDC discovery(/.well-known/openid-configuration)の
          # introspection_endpoint_auth_methods_supportedはclient_secret_basicと
          # private_key_jwtのみでclient_secret_post(=Dovecotのintrospection_mode=post時に
          # client_id/client_secretを別設定した場合の既定送信方法)をサポートしない。
          # Dovecotのintrospection_mode=authはPOSTではなくGET+Bearer認証を行う別モードであり
          # (task 5.3のk3d実機でGETがZitadel側に400 Bad Requestで拒否されることを確認済み)、
          # client_secret_basicを使わせるにはintrospection_mode=postのままURLに
          # client_id:client_secret@ を埋め込んでBasic認証ヘッダを送出させる必要がある
          # (task 5.3で実機のDovecot+Roundcube+Zitadelの3者結合テストにより検証済み)。
          # ドメインはPoC時点のプレースホルダー。本番Zitadelの外部公開ホスト名確定後
          # (tasks.md task 9.4)に実際の値へ更新すること。
          # client_secretにURL予約文字(@ : / ? # など)が含まれると認証情報の埋め込みが
          # 壊れる。Zitadelが払い出すsecretは英数字のみのため現状問題ないが、
          # 再発行等で記号を含む値になった場合はこの埋め込み形式を見直すこと。
          introspection_mode = post
          introspection_url = https://{{ .ROUNDCUBE_OIDC_CLIENT_ID }}:{{ .MAIL_OAUTH2_CLIENT_SECRET }}@zitadel.aramakisai.com/oauth/v2/introspect
          username_attribute = email
          active_attribute = active
          active_value = true
          # Zitadelのproject role assertionはuserdb_acl_groups相当の単一クレームを直接返さない
          # (urn:zitadel:iam:org:project:role:<key> 形式の個別クレームになる)ため、
          # ACLグループのpass_attrsマッピングはこのtaskのスコープ外(Dovecot Lua Auth Bridge
          # 側のtask 3.2のみ対応)。Roundcube経由の共有メールボックスACLが必要になった場合は
          # 別途Actionsで単一クレームへ変換するか、pass_attrsを複数のurn:zitadel:...クレームの
          # 論理和として組み立てる対応を追加検討すること。
  data:
    # Zitadel roundcube OIDC ApplicationのIDs (zitadel_applications.tfのclient_id/secret出力を
    # 本番apply後にInfisicalへ手動登録する、既存MAIL_OAUTH2_CLIENT_SECRETと同じ運用)
    - secretKey: ROUNDCUBE_OIDC_CLIENT_ID
      remoteRef:
        key: ROUNDCUBE_OIDC_CLIENT_ID
    - secretKey: MAIL_OAUTH2_CLIENT_SECRET
      remoteRef:
        key: MAIL_OAUTH2_CLIENT_SECRET
