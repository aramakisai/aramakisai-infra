---
# Dovecot Lua Auth Bridge (ansible/roles/zitadel-cutover) が呼び出す
# Zitadel machine user "dovecot-lua-auth" のPAT。
# 発行元: ansible/playbooks/zitadel-resources.yml (zitadel_machine_users)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dovecot-lua-auth-secret
  namespace: prod
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: dovecot-lua-auth-secret
    creationPolicy: Owner
  data:
    - secretKey: pat
      remoteRef:
        key: DOVECOT_ZITADEL_AUTH_PAT
