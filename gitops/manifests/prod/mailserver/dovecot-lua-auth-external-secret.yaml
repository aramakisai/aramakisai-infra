---
# task 3.5で実機検証した最小スコープ(IAM_LOGIN_CLIENT、IAM_OWNER不要)のPATを
# Dovecot Lua Auth Bridge(zitadel-auth.lua)へ注入する。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dovecot-zitadel-auth
  namespace: prod
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: dovecot-zitadel-auth
    creationPolicy: Owner
  data:
    - secretKey: zitadel.pat
      remoteRef:
        key: DOVECOT_ZITADEL_AUTH_PAT
