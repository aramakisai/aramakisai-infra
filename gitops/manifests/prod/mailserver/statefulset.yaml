---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mailserver
  namespace: prod
  labels:
    app: mailserver
  annotations:
    secret.reloader.stakater.com/reload: "mail-tls,mailserver-secrets,dovecot-oauth2-config,dovecot-lua-auth-secret"
    configmap.reloader.stakater.com/reload: "mailserver-config"
spec:
  serviceName: mailserver
  replicas: 1
  selector:
    matchLabels:
      app: mailserver
  template:
    metadata:
      labels:
        app: mailserver
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/hostname: prod-node-1
      containers:
        - name: mailserver
          image: mailserver/docker-mailserver:15.1.0
          imagePullPolicy: IfNotPresent
          # fail2ban が BAN 実行時に nftables テーブルを操作するため NET_ADMIN/NET_RAW が必要。
          # 付与なしだと fail2ban-client 上は banned 表示になるが実際は
          # `Operation not permitted (you must be root)` で iptables/nftables ルールが
          # 反映されず、無制限にブルートフォース試行を許してしまう。
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          ports:
            - name: smtp
              containerPort: 25
            - name: submission
              containerPort: 587
            - name: smtps
              containerPort: 465
            - name: imap
              containerPort: 143
            - name: imaps
              containerPort: 993
          env:
            - name: OVERRIDE_HOSTNAME
              value: "mail.aramakisai.com"
            - name: TLS_LEVEL
              value: "modern"
            # ML アドレス(配送専用、ログイン不可)は DMS 標準の FILE provisioner で
            # 静的に定義する (configmap.yaml の postfix-accounts.cf 参照)。
            # ログイン主体の認証は Zitadel へ委譲するため LDAP は使わない。
            - name: ACCOUNT_PROVISIONER
              value: "FILE"
            # FILE provisioner は既定で quota を有効化するが、quota は運用しない
            - name: ENABLE_QUOTAS
              value: "0"
            # 送信者認可の最終ルールは user-patches.sh で上書きする (configmap.yaml 参照)
            - name: SPOOF_PROTECTION
              value: "1"
            # Roundcube OAuth2 クライアントシークレット (OAUTHBEARER introspection 用)
            - name: MAIL_OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mailserver-secrets
                  key: MAIL_OAUTH2_CLIENT_SECRET
            # SMTP 直接配送 (2026-07-01: Resend リレー廃止)
            # DEFAULT_RELAY_HOST 未設定 → Postfix が宛先ドメインの MX へ直接配送する
            # セキュリティ・スパム設定
            - name: ENABLE_FAIL2BAN
              value: "1"
            - name: ENABLE_RSPAMD
              value: "1"
            - name: ENABLE_CLAMAV
              value: "0"
            # Rspamd有効時の公式推奨構成: Amavisと機能が重複するため無効化しメモリを削減する
            - name: ENABLE_AMAVIS
              value: "0"
            # TLS 設定 (cert-manager 証明書マウント位置の指定)
            - name: SSL_TYPE
              value: "manual"
            - name: SSL_CERT_PATH
              value: "/etc/dms/tls-secret/tls.crt"
            - name: SSL_KEY_PATH
              value: "/etc/dms/tls-secret/tls.key"
          resources:
            # ENABLE_AMAVIS=0 ロールアウト後、26時間の実トラフィックで安定して
            # 424Mi (kubectl top) を実測。requestは実測値に小さめのマージンを乗せ、
            # limitはrspamd等のスパイクに備え約1.8倍の余裕を持たせる。
            requests:
              cpu: "200m"
              memory: "448Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          volumeMounts:
            - name: data
              mountPath: /var/mail
            - name: dms-config
              mountPath: /tmp/docker-mailserver/dovecot.cf
              subPath: dovecot.cf
              readOnly: true
            - name: dms-config
              mountPath: /etc/dovecot/conf.d/auth-passwdfile.inc
              subPath: auth-passwdfile.inc
              readOnly: true
            - name: dms-config
              mountPath: /etc/dovecot/zitadel-auth.lua
              subPath: zitadel-auth.lua
              readOnly: true
            - name: dovecot-lua-auth
              mountPath: /run/secrets/zitadel-dovecot-pat
              subPath: pat
              readOnly: true
            - name: dms-config
              mountPath: /etc/dovecot/conf.d/05-acl-plugin.conf
              subPath: 05-acl-plugin.conf
              readOnly: true
            - name: dms-config
              mountPath: /tmp/docker-mailserver/postfix-accounts.cf
              subPath: postfix-accounts.cf
              readOnly: true
            - name: dms-config
              mountPath: /tmp/docker-mailserver/postfix-virtual.cf
              subPath: postfix-virtual.cf
              readOnly: true
            - name: dms-config
              mountPath: /tmp/docker-mailserver/ml-sender-access.cf
              subPath: ml-sender-access.cf
              readOnly: true
            - name: dms-config
              mountPath: /tmp/docker-mailserver/sender-login-maps.cf
              subPath: sender-login-maps.cf
              readOnly: true
            - name: dms-config
              mountPath: /tmp/docker-mailserver/user-patches.sh
              subPath: user-patches.sh
              readOnly: true
            - name: dovecot-oauth2
              mountPath: /etc/dovecot/dovecot-oauth2.conf.ext
              subPath: dovecot-oauth2.conf.ext
              readOnly: true
            - name: tls
              mountPath: /etc/dms/tls-secret
              readOnly: true
            - name: dkim-keys
              mountPath: /tmp/docker-mailserver/opendkim/keys
              readOnly: true
            - name: dms-config
              mountPath: /tmp/docker-mailserver/opendkim/KeyTable
              subPath: opendkim-keytable
              readOnly: true
            - name: dms-config
              mountPath: /tmp/docker-mailserver/opendkim/SigningTable
              subPath: opendkim-signingtable
              readOnly: true
            - name: dms-config
              mountPath: /tmp/docker-mailserver/opendkim/TrustedHosts
              subPath: opendkim-trustedhosts
              readOnly: true
            - name: dms-config
              mountPath: /tmp/docker-mailserver/rspamd/override.d/worker-proxy.inc
              subPath: rspamd-worker-proxy.inc
              readOnly: true
            - name: dms-config
              mountPath: /tmp/docker-mailserver/rspamd/override.d/worker-controller.inc
              subPath: rspamd-worker-controller.inc
              readOnly: true
            - name: dms-config
              mountPath: /tmp/docker-mailserver/fail2ban-jail.cf
              subPath: fail2ban-jail.cf
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 25
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 25
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mailserver-data
        - name: dms-config
          configMap:
            name: mailserver-config
            items:
              - key: dovecot.cf
                path: dovecot.cf
              - key: auth-passwdfile.inc
                path: auth-passwdfile.inc
              - key: zitadel-auth.lua
                path: zitadel-auth.lua
              - key: 05-acl-plugin.conf
                path: 05-acl-plugin.conf
              - key: postfix-accounts.cf
                path: postfix-accounts.cf
              - key: postfix-virtual.cf
                path: postfix-virtual.cf
              - key: ml-sender-access.cf
                path: ml-sender-access.cf
              - key: sender-login-maps.cf
                path: sender-login-maps.cf
              - key: user-patches.sh
                path: user-patches.sh
              - key: opendkim-keytable
                path: opendkim-keytable
              - key: opendkim-signingtable
                path: opendkim-signingtable
              - key: opendkim-trustedhosts
                path: opendkim-trustedhosts
              - key: rspamd-worker-proxy.inc
                path: rspamd-worker-proxy.inc
              - key: rspamd-worker-controller.inc
                path: rspamd-worker-controller.inc
              - key: fail2ban-jail.cf
                path: fail2ban-jail.cf
        - name: dovecot-oauth2
          secret:
            secretName: dovecot-oauth2-config
        - name: dovecot-lua-auth
          secret:
            secretName: dovecot-lua-auth-secret
        - name: tls
          secret:
            secretName: mail-tls
        - name: dkim-keys
          secret:
            defaultMode: 420
            optional: true
            secretName: mailserver-dkim
            items:
              - key: dkim-key
                path: aramakisai.com/mail.private
