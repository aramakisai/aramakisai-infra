---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  url: https://argocd.aramakisai.com
  oidc.config: |
    name: Zitadel
    issuer: https://idp.aramakisai.com
    clientID: $argocd-oidc-secret:clientID
    clientSecret: $argocd-oidc-secret:clientSecret
    # groups claimはscope指定ではなくZitadelのgroupsClaim Action(project roleキー)が付与する
    requestedScopes: ["openid", "profile", "email"]
  admin.enabled: "false"
