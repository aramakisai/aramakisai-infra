# 外部 API の資格情報。collector だけが読む。読み取り専用を作れないもの
# (HCP Terraform・Hetzner Object Storage・Zitadel) もここに置く
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: collector-secrets
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: collector-secrets
    creationPolicy: Owner
  data:
    - {secretKey: OPS_HCLOUD_READ_TOKEN, remoteRef: {key: OPS_HCLOUD_READ_TOKEN}}
    - {secretKey: OPS_CLOUDFLARE_READ_TOKEN, remoteRef: {key: OPS_CLOUDFLARE_READ_TOKEN}}
    - {secretKey: OPS_TFC_TOKEN, remoteRef: {key: OPS_TFC_TOKEN}}
    - {secretKey: OPS_TAILSCALE_OAUTH_CLIENT_ID, remoteRef: {key: OPS_TAILSCALE_OAUTH_CLIENT_ID}}
    - {secretKey: OPS_TAILSCALE_OAUTH_CLIENT_SECRET, remoteRef: {key: OPS_TAILSCALE_OAUTH_CLIENT_SECRET}}
    - {secretKey: OPS_NETDATA_API_TOKEN, remoteRef: {key: OPS_NETDATA_API_TOKEN}}
    - {secretKey: OPS_UPTIMEROBOT_READONLY_KEY, remoteRef: {key: OPS_UPTIMEROBOT_READONLY_KEY}}
    - {secretKey: OPS_HEALTHCHECKS_READONLY_KEY, remoteRef: {key: OPS_HEALTHCHECKS_READONLY_KEY}}
    - {secretKey: OPS_ZITADEL_READER_PAT, remoteRef: {key: OPS_ZITADEL_READER_PAT}}
    - {secretKey: OPS_MAIL_AGENT_TOKEN, remoteRef: {key: OPS_MAIL_AGENT_TOKEN}}
    - {secretKey: OPS_FALCO_WEBHOOK_TOKEN, remoteRef: {key: OPS_FALCO_WEBHOOK_TOKEN}}
    # 既存キーの再利用 (CNPG・VolSync と同じ Object Storage 認証情報、Netdata space、Cloudflare account ID)
    - {secretKey: TF_VAR_cloudflare_account_id, remoteRef: {key: TF_VAR_cloudflare_account_id}}
    - {secretKey: HETZNER_OS_ACCESS_KEY_ID, remoteRef: {key: HETZNER_OS_ACCESS_KEY_ID}}
    - {secretKey: HETZNER_OS_SECRET_ACCESS_KEY, remoteRef: {key: HETZNER_OS_SECRET_ACCESS_KEY}}
    - {secretKey: TF_VAR_netdata_space_id, remoteRef: {key: TF_VAR_netdata_space_id}}
