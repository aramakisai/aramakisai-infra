# collector の宣言ファイル。起動時に検証され、誤りがあると collector は起動に失敗する。
# 同一サービスの plans は期間 (from〜until、until 省略は無期限) が重ならないこと。
# プランを切り替えるときは、この表の期間を書き換えるだけでよい。

[[plans]]
service = "cloudflare_workers"
name = "Workers Free"
paid = false
from = "2020-01-01"
until = "2026-10-22"
limits = { requests_day = 100_000, do_requests_day = 100_000, do_gbs_day = 13_000, d1_rows_read_day = 5_000_000, d1_rows_written_day = 100_000, d1_storage_gb = 5, ae_writes_day = 100_000 }

[[plans]]
service = "cloudflare_workers"
name = "Workers Paid"
paid = true
from = "2026-10-23"
until = "2026-11-22"
limits = { requests_month = 10_000_000, cpu_ms_month = 30_000_000, do_requests_month = 1_000_000, do_gbs_month = 400_000, d1_rows_read_month = 25_000_000_000, d1_rows_written_month = 50_000_000, d1_storage_gb = 5, ae_writes_month = 10_000_000 }

[[plans]]
service = "cloudflare_workers"
name = "Workers Free"
paid = false
from = "2026-11-23"
limits = { requests_day = 100_000, do_requests_day = 100_000, do_gbs_day = 13_000, d1_rows_read_day = 5_000_000, d1_rows_written_day = 100_000, d1_storage_gb = 5, ae_writes_day = 100_000 }

[[plans]]
service = "cloudflare_r2"
name = "R2 Free"
paid = false
from = "2020-01-01"
limits = { storage_gb = 10, class_a_month = 1_000_000, class_b_month = 10_000_000 }

[[plans]]
service = "cloudflare_zero_trust"
name = "Zero Trust Free"
paid = false
from = "2020-01-01"
limits = { users = 50 }

[[plans]]
service = "hcp_terraform"
name = "HCP Terraform Free"
paid = false
from = "2020-01-01"
limits = { managed_resources = 500 }

[[plans]]
service = "infisical"
name = "Infisical Free"
paid = false
from = "2020-01-01"
limits = { identities = 5 }

[[plans]]
service = "tailscale"
name = "Tailscale Free"
paid = false
from = "2020-01-01"
limits = { users = 6 }

[[plans]]
service = "netdata_cloud"
name = "Netdata Cloud Free"
paid = false
from = "2020-01-01"
limits = { nodes = 5 }

[[plans]]
service = "healthchecks"
name = "Healthchecks.io Free"
paid = false
from = "2020-01-01"
limits = { checks = 20 }

[[plans]]
service = "uptimerobot"
name = "UptimeRobot Free"
paid = false
from = "2020-01-01"
limits = { monitors = 50 }

[[plans]]
service = "github"
name = "GitHub Free"
paid = false
from = "2020-01-01"
limits = { actions_minutes_month = 2_000, packages_storage_gb = 0.5 }

[[plans]]
service = "hetzner_object_storage"
name = "Object Storage 基本料金"
paid = true
from = "2020-01-01"
limits = { storage_gb = 1_000, price_month = 6.49 }

# 稼働しているべき Hetzner Cloud サーバー。ここにないサーバーの稼働は差分として表示する。
[[servers]]
name = "prod-node-1"

[[servers]]
name = "prod-node-2"

[[servers]]
name = "prod-node-3"

[thresholds]
warn_ratio = 0.8
cert_warn_days = 21
cert_crit_days = 7
pod_restart_warn = 5
disk_warn = 0.85
disk_crit = 0.95
memory_warn = 0.85
volsync_max_age = "12h"
backup_max_age = { "prod/directus-db" = "36h", "prod/authentik-db" = "8d", "zitadel/zitadel-db" = "36h" }

# 有効期限を設定した資格情報。期限日は発行時に控えた値を宣言する。
[[credentials]]
name = "Cloudflare API トークン"
expires_on = "2027-10-31"

[[credentials]]
name = "HCP Terraform organization トークン"
expires_on = "2027-10-31"

[[credentials]]
name = "サイネージ通知 Service Token"
expires_on = "2027-10-12"

# 有効期間はサイネージ通知 Service Token と同じ 8760h。日付は発行日 + 8760h で、apply 後に実際の期限へ書き換える (仮)
[[credentials]]
name = "collector サイネージ Service Token"
expires_on = "2027-11-04"

# 凍結中のワークロード (Namespace または名前) は取得結果から除外する。
# prod Namespace に置かれた付随リソース (バックアップ・DB の Application・ExternalSecret) は名前で列挙する。
[exclude]
namespaces_or_names = ["vaultwarden-rbac-sync", "room-presence", "room-presence-db", "presence-secrets"]

# 情報源ごとの非秘匿の宣言 (呼び出し先・対象)。キーは source_id。
[sources."billing.github"]
org = "aramakisai"

[sources."ci.github"]
org = "aramakisai"
repos = ["aramakisai-infra", "aramakisai-web"]

# Zitadel は Host でインスタンスを解決するため、Service DNS 名で接続するときは公開ホスト名を渡す
[sources."auth.zitadel"]
instance_host = "idp.aramakisai.com"

[sources."billing.hcp_terraform"]
org = "aramakisai"

[sources."billing.hetzner_os"]
endpoint = "https://fsn1.your-objectstorage.com"
buckets = ["aramakisai-backups"]

# Cloudflare account ID は秘匿扱い (Infisical の TF_VAR_cloudflare_account_id を環境変数で受ける)。
# tunnel は terraform の cloudflare_zero_trust_tunnel_cloudflared.main の name から ID を引く。
[sources."connect.tunnel"]
tunnel_name = "aramakisai-k3s"

# 当日監視。値は初期値 (仮) で、リハーサルで見直す。
# 宣言を消すと当日監視の取得・評価・通知は何もしない状態になる。
[festival]
page_url = "https://dash.aramakisai.com/admin/festival"
renotify = "30m"
source_failure_grace = "3m"
# cms Deployment の env SIGNAGE_QUAKE_URL と同じ値
quake_url = "https://aramakisai-signage-quake.aramakisai.workers.dev"
# aramakisai-web の frontend/src/lib/use-bus-realtime.ts と同じ ODPT の公開フィード。末尾にフィード名を付けて取る
bus_feed_base = "https://api-public.odpt.org/api/v4/gtfs/realtime/odpt_Kan_etsuTransportation_AllLines_"
disabled_sources = []

[festival.max_age]
"festival.cloudflare" = "3m"
"festival.stamp" = "3m"
"festival.quake" = "3m"
"festival.signage" = "3m"
"festival.parking" = "3m"
"festival.schedule" = "15m"
"festival.bus" = "2m"
"festival.nodes" = "3m"
"festival.workloads" = "2m"
"festival.cnpg" = "2m"
"monitor.uptimerobot" = "12m"
"monitor.healthchecks" = "12m"
"connect.tunnel" = "5m"
"ci.github" = "25m"
"mail.fail2ban" = "12m"

[festival.cloudflare]
worker_script = "aramakisai-web"
cms_host = "cms.aramakisai.com"
media_path_like = "/api/media/%"
hub_object_name = "signage-hub"
# トラフィックタブに出すホスト (表示順)。一覧に無いホストの件数は「その他」に合算する
traffic_hosts = [
  "aramakisai.com",
  "dev.aramakisai.com",
  "shift.aramakisai.com",
  "karaage.aramakisai.com",
  "cms.aramakisai.com",
  "idp.aramakisai.com",
  "argocd.aramakisai.com",
  "presence.aramakisai.com",
  "vault.aramakisai.com",
  "dash.aramakisai.com",
  "webmail.aramakisai.com",
  "api.aramakisai.com",
  "www.aramakisai.com",
  "origin-2025.aramakisai.com",
]

# web 側の反映前は false
[festival.parking]
enabled = false

[festival.signage]
url = "https://aramakisai.com/api/signage/stats"

[festival.cms]
namespace = "prod"
deployment = "cms"
pod_selector = "app=cms"
db_cluster = "directus-db"
service_base = "http://cms.prod.svc.cluster.local:80"
restart_window = "30m"

[festival.cloudflared]
namespace = "cloudflared"
pod_selector = "app=cloudflared"

[festival.uptime_monitors]
idp = "Zitadel IdP"
cms_db = "Payload CMS API (DB 経由)"

[festival.falco]
window = "15m"
warn_priority = "warning"
crit_priority = "critical"

[festival.min_requests]
worker_error_rate = 50
cms_5xx_rate = 50

# 値の根拠は design の「閾値」の表。表にない閾値名 (OPTIONAL_THRESHOLDS) は宣言しない。
# 異常を宣言しない閾値は crit を書かない。
[festival.thresholds]
worker_error_rate = { warn = 0.02 }
worker_exceeded = { warn = 1 }
worker_cpu_p99_ms = { warn = 1000 }
cms_5xx_rate = { warn = 0.03, crit = 0.10 }
cms_origin_p95_ms = { warn = 3000, crit = 10000 }
media_4xx = { warn = 20, crit = 100 }
media_5xx = { warn = 1 }
parking_capture_age = { warn = "10m", crit = "15m" }
quake_cron_age = { warn = "7m", crit = "12m" }
bus_feed_age = { warn = "2m", crit = "5m" }
cms_ready_ratio = { warn = 1.0, crit = 0.5 }
pod_cpu_ratio = { warn = 0.5, crit = 0.85 }
db_connections_ratio = { warn = 0.5, crit = 0.7 }
db_memory_rss_ratio = { warn = 0.5 }
cpu_throttle_ratio = { warn = 0.3, crit = 0.7 }
node_cpu_ratio = { warn = 0.75, crit = 0.9 }
node_disk_ratio = { warn = 0.85, crit = 0.95 }
tunnel_connections = { warn = 12, crit = 8 }
