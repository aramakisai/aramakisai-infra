# 認可ルーティングの正本。認可判断は auth_request の結果だけで行う。
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  access_log /dev/stdout;
  server_tokens off;

  # 非 root・読み取り専用ルートで動かすため一時領域を /tmp に寄せる
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # collector が未作成でも起動できるよう、upstream は変数で遅延解決する
  resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

  # グループはカンマ区切りの完全一致 (admin2・notadmin を admin として扱わない)
  map ",$auth_groups," $is_admin {
    default 0;
    "~,admin," 1;
  }

  # rewrite/return は auth_request より前に評価されるため、認可結果による切替は try_files だけで行う
  map $is_admin $config_file {
    default /assets/config.yml;
    1 /assets/config-admin.yml;
  }

  server {
    listen 8080;
    root /usr/share/nginx/portal;

    # cloudflared とは http・8080 で接続するため、絶対 URL にすると Location が http://host:8080 になる
    absolute_redirect off;

    error_page 500 502 503 504 /denied/error.html;

    location = /healthz {
      access_log off;
      proxy_pass http://127.0.0.1:4180/ping;
    }

    location /oauth2/ {
      proxy_pass http://127.0.0.1:4180;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # URI を固定し、元のリクエスト URI を oauth2-proxy に渡さない
    location = /_auth/executive {
      internal;
      proxy_pass http://127.0.0.1:4180/oauth2/auth?allowed_groups=executive;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /_auth/admin {
      internal;
      proxy_pass http://127.0.0.1:4180/oauth2/auth?allowed_groups=admin;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }

    # $uri はデコード済みで CR/LF がヘッダに混入するため、エンコードされたままの $request_uri を使う
    location @login {
      return 302 /oauth2/start?rd=$request_uri;
    }

    # /admin/ の 403 は error_page で内部転送されここに来る。add_header は継承されないため再掲する
    location /denied/ {
      alias /usr/share/nginx/pages/;
      add_header Cache-Control "private, no-store" always;
    }

    location = /assets/config.yml {
      auth_request /_auth/executive;
      auth_request_set $auth_groups $upstream_http_x_auth_request_groups;
      # --cookie-refresh で更新されたセッション Cookie をブラウザへ返す (回転する refresh token を失わないため)
      auth_request_set $auth_cookie $upstream_http_set_cookie;
      add_header Set-Cookie $auth_cookie;
      add_header Cache-Control "private, no-store" always;
      # 401 を 302 にすると Homer が設定なしとして扱うため、401 のまま返す
      try_files $config_file =404;
    }

    # 生成元・配布物の直接取得は認証状態に関わらず 404
    location ~ ^/assets/(config-admin|links|admin-overlay)\.ya?ml$ {
      return 404;
    }
    location ~ \.dist$ {
      return 404;
    }

    location = /admin {
      return 301 /admin/;
    }

    location /admin/ {
      auth_request /_auth/admin;
      # --cookie-refresh で更新されたセッション Cookie をブラウザへ返す (回転する refresh token を失わないため)
      auth_request_set $auth_cookie $upstream_http_set_cookie;
      add_header Set-Cookie $auth_cookie;
      error_page 401 = @login;
      error_page 403 /denied/denied-admin.html;
      error_page 500 502 503 504 /denied/error.html;
      add_header Cache-Control "private, no-store" always;
      set $collector http://collector.ops-dashboard.svc.cluster.local:8080;
      proxy_pass $collector;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      auth_request /_auth/executive;
      # --cookie-refresh で更新されたセッション Cookie をブラウザへ返す (回転する refresh token を失わないため)
      auth_request_set $auth_cookie $upstream_http_set_cookie;
      add_header Set-Cookie $auth_cookie;
      error_page 401 = @login;
      error_page 403 /denied/denied.html;
      error_page 500 502 503 504 /denied/error.html;
      index index.html;
    }
  }
}
