# 認可統合テスト用。パスは test_authz.py が環境変数で渡す。
services:
  mock:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'
    ports: ["18081:8080"]
  collector:
    image: nginx:1.27.5-alpine
    networks:
      default:
        aliases: [collector.ops-dashboard.svc.cluster.local]
    volumes:
      - ${T_COLLECTOR_CONF}:/etc/nginx/conf.d/default.conf:ro
  nginx:
    image: nginx:1.27.5-alpine
    # 本番と同じく nginx と oauth2-proxy は 1 つのネットワーク名前空間 (127.0.0.1:4180) を共有する
    command: ["nginx", "-c", "/etc/nginx/portal/nginx.conf", "-g", "daemon off;"]
    ports: ["18080:8080"]
    depends_on: [collector]
    volumes:
      - ${T_WORK}/nginx.conf:/etc/nginx/portal/nginx.conf:ro
      - ${T_PORTAL}/pages:/usr/share/nginx/pages:ro
      - ${T_WORK}/site:/usr/share/nginx/portal:ro
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    network_mode: service:nginx
    # mock の起動前に discovery で落ちるため再試行する
    restart: on-failure
    depends_on: [mock]
    command:
      - --provider=oidc
      - --oidc-issuer-url=http://mock:8080/default
      - --client-id=portal
      - --client-secret=secret
      - --scope=openid email profile
      - --oidc-groups-claim=groups
      - --code-challenge-method=S256
      - --redirect-url=http://localhost:18080/oauth2/callback
      - --http-address=127.0.0.1:4180
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --email-domain=*
      - --skip-provider-button=true
      - --cookie-secure=false
      - --cookie-secret=0123456789abcdef0123456789abcdef # gitleaks:allow
      - --insecure-oidc-allow-unverified-email=true
