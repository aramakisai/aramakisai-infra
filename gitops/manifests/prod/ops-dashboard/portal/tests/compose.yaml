# 認可統合テスト用。パスは test_authz.py が環境変数で渡す。
services:
  mock:
    image: ghcr.io/navikt/mock-oauth2-server:2.3.0
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'
    ports: ["18081:8080"]
  collector:
    image: nginx:1.27.5-alpine
    networks:
      default:
        aliases: [collector.ops-dashboard.svc.cluster.local]
    volumes:
      - ${T_COLLECTOR_CONF}:/etc/nginx/conf.d/default.conf:ro
  valkey:
    image: valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    # 本番の redis.yaml と同じ権限・引数で動くことを確かめる
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    command: ["--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    tmpfs: ["/data:uid=65532,gid=65532"]
    networks:
      default:
        aliases: [portal-redis]
  nginx:
    image: nginx:1.27.5-alpine
    # 本番と同じく nginx と oauth2-proxy は 1 つのネットワーク名前空間 (127.0.0.1:4180) を共有する
    command: ["nginx", "-c", "/etc/nginx/portal/nginx.conf", "-g", "daemon off;"]
    ports: ["18080:8080"]
    depends_on: [collector]
    volumes:
      - ${T_WORK}/nginx.conf:/etc/nginx/portal/nginx.conf:ro
      - ${T_PORTAL}/pages:/usr/share/nginx/pages:ro
      - ${T_WORK}/site:/usr/share/nginx/portal:ro
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    network_mode: service:nginx
    # mock の起動前に discovery で落ちるため再試行する
    restart: on-failure
    depends_on: [mock, valkey]
    command:
      - --provider=oidc
      - --oidc-issuer-url=http://mock:8080/default
      - --client-id=portal
      - --client-secret=secret
      - --scope=openid email profile offline_access
      - --oidc-groups-claim=groups
      - --code-challenge-method=S256
      - --redirect-url=http://localhost:18080/oauth2/callback
      - --http-address=127.0.0.1:4180
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --email-domain=*
      - --skip-provider-button=true
      - --whitelist-domain=idp.aramakisai.com
      - --cookie-secure=false
      - --cookie-expire=12h
      - --cookie-refresh=1h
      - --cookie-csrf-per-request=true
      - --cookie-csrf-expire=5m
      - --cookie-secret=0123456789abcdef0123456789abcdef # gitleaks:allow
      - --session-store-type=redis
      - --redis-connection-url=redis://portal-redis:6379
      - --insecure-oidc-allow-unverified-email=true
