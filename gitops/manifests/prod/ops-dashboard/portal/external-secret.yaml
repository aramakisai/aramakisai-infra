---
# oauth2-proxy の OIDC クライアント (zitadel-bootstrap が Infisical へ自動登録) と cookie 暗号鍵
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-oidc
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: portal-oidc
    creationPolicy: Owner
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: OPS_PORTAL_OIDC_CLIENT_ID
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: OPS_PORTAL_OIDC_CLIENT_SECRET
    # 32 バイトのランダム値
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: OPS_PORTAL_COOKIE_SECRET
---
# 内部向けリンクの URL。OIDC の Secret と分けるのは、これが取得できなくても
# ポータル全体を止めず、該当リンクだけを非表示にするため (Deployment 側で optional)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-link-urls
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: portal-link-urls
    creationPolicy: Owner
  data:
    - secretKey: PORTAL_NOTION_URL
      remoteRef:
        key: PORTAL_NOTION_URL
    - secretKey: PORTAL_GOOGLE_DRIVE_URL
      remoteRef:
        key: PORTAL_GOOGLE_DRIVE_URL
    - secretKey: PORTAL_DISCORD_URL
      remoteRef:
        key: PORTAL_DISCORD_URL
