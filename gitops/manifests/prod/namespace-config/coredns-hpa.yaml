---
# k3s 同梱 CoreDNS を常に 2 台にする
# 同梱マニフェストの Deployment には spec.replicas が無く、k3s 再起動時の AddOn 再適用で台数が
# 1 に戻るため、HPA で下限を固定する。metrics は HPA の必須項目を満たすためだけで、
# min = max により CPU 使用率で台数は変わらない。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coredns
  namespace: kube-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coredns
  minReplicas: 2
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
