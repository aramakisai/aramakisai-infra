---
# Actions v2 webhook受信用 ClusterIP Service (Requirement 4.1, 4.2)。
# prod namespace内のZitadel (terraform/zitadel_actions.tf の action_target.endpoint) から
# クラスタ内DNS経由でのみ到達される。外部公開はしない (design.md「vaultwarden-rbac-sync
# (webhook常駐版)」参照)。
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden-rbac-sync
  namespace: prod
  labels:
    app: vaultwarden-rbac-sync
spec:
  type: ClusterIP
  selector:
    app: vaultwarden-rbac-sync
  ports:
    - name: http
      port: 80
      targetPort: 8080
