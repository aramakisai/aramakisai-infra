---
# vaultwarden-rbac-sync 用シークレット
# Infisical の prod 環境から取得する
#
# ZITADEL_API_TOKEN: task 4実装時点では未発行(本番Zitadelが存在しないため)。
#   task 9(本番カットオーバー)でZitadel Management API呼び出し専用PAT/Service Userを
#   発行しInfisicalへ登録する(AUTHENTIK_API_TOKENの旧パターンを踏襲)。
# ZITADEL_WEBHOOK_SIGNING_KEY: terraform/zitadel_actions.tf の
#   zitadel_action_target.vaultwarden_rbac_sync が払い出すsigning_key。
#   apply後にterraform outputから手動でInfisicalへ反映する。
# VAULTWARDEN_SA_CLIENT_ID / VAULTWARDEN_SA_CLIENT_SECRET: 専用サービスアカウントの
#   Personal API Key。発行手順は .kiro/steering/vaultwarden-rbac.md を参照
#   (SSO_ONLY一時解除を伴う一回限りの手動ブートストラップ作業)
# Discord通知は無効化済み (DISCORD_WEBHOOK_URL未設定→sync.py側でnotify skip)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-rbac-sync-secrets
  namespace: prod
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: vaultwarden-rbac-sync-secrets
    creationPolicy: Owner
  data:
    - secretKey: ZITADEL_API_TOKEN
      remoteRef:
        key: VAULTWARDEN_RBAC_SYNC_ZITADEL_API_TOKEN
    - secretKey: ZITADEL_WEBHOOK_SIGNING_KEY
      remoteRef:
        key: VAULTWARDEN_RBAC_SYNC_ZITADEL_WEBHOOK_SIGNING_KEY
    - secretKey: VAULTWARDEN_SA_CLIENT_ID
      remoteRef:
        key: VAULTWARDEN_SA_CLIENT_ID
    - secretKey: VAULTWARDEN_SA_CLIENT_SECRET
      remoteRef:
        key: VAULTWARDEN_SA_CLIENT_SECRET
    - secretKey: VAULTWARDEN_ORG_KEY
      remoteRef:
        key: VAULTWARDEN_ORG_KEY
