---
# Payload CMS アプリケーション用シークレット
# Infisical の prod 環境から取得する
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cms-secrets
  namespace: prod
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: cms-secrets
    creationPolicy: Owner
    template:
      data:
        # CNPG クラスタは Directus と共用し、データベースだけ payload を分ける。
        # クラスタ名が directus-db のままなのは Directus 撤去後も同じクラスタを使い続けるため
        DATABASE_URL: >-
          postgres://payload:{{ .PAYLOAD_DB_PASSWORD }}@directus-db-rw.prod.svc.cluster.local:5432/payload
        PAYLOAD_SECRET: "{{ .PAYLOAD_SECRET }}"
        PAYLOAD_DB_PASSWORD: "{{ .PAYLOAD_DB_PASSWORD }}"
        S3_ACCESS_KEY_ID: "{{ .S3_ACCESS_KEY_ID }}"
        S3_SECRET_ACCESS_KEY: "{{ .S3_SECRET_ACCESS_KEY }}"
        AUTHENTIK_CLIENT_SECRET: "{{ .AUTHENTIK_CLIENT_SECRET }}"
        AUTHENTIK_CLIENT_ID: "{{ .AUTHENTIK_CLIENT_ID }}"
        # migrate の PreSync Job (cms-secrets のみ参照) からも読める必要があるため、
        # Deployment の env ではなくここに置く
        SMTP_HOST: "mailserver.prod.svc.cluster.local"
        NOREPLY_SMTP_PASSWORD: "{{ .NOREPLY_SMTP_PASSWORD }}"
  data:
    - secretKey: PAYLOAD_SECRET
      remoteRef:
        key: PAYLOAD_SECRET
    - secretKey: PAYLOAD_DB_PASSWORD
      remoteRef:
        key: PAYLOAD_DB_PASSWORD
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: HETZNER_OS_ACCESS_KEY_ID
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: HETZNER_OS_SECRET_ACCESS_KEY
    - secretKey: AUTHENTIK_CLIENT_SECRET
      remoteRef:
        key: CMS_PROD_OIDC_CLIENT_SECRET
    # Zitadelが発行するclient_id (数値、非機密だがtask9.2実行まで値が確定しないため
    # ExternalSecret経由で注入する。CMS_PROD_OIDC_CLIENT_IDはInfisicalの
    # ansible/roles/zitadel-bootstrap/vars/resources.yml infisical_hintと同じキー)
    - secretKey: AUTHENTIK_CLIENT_ID
      remoteRef:
        key: CMS_PROD_OIDC_CLIENT_ID
    - secretKey: NOREPLY_SMTP_PASSWORD
      remoteRef:
        key: NOREPLY_SMTP_PASSWORD
---
# CNPG の managed.roles (directus-db クラスタ) が参照する payload ロールの認証情報
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cms-db-credentials
  namespace: prod
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: cms-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "payload"
        password: "{{ .PAYLOAD_DB_PASSWORD }}"
  data:
    - secretKey: PAYLOAD_DB_PASSWORD
      remoteRef:
        key: PAYLOAD_DB_PASSWORD
