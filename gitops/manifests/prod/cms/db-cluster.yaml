---
# PostgreSQL クラスター (CloudNativePG)。名称は directus-db のままだが、
# 9.1 の Directus 撤去で cms Application 側へ移設した。Payload の payload DB が
# このクラスタの managed.roles に同居しており、rename は CNPG では再作成
# (=データ損失) 相当のため名前は変えない。directus データベース自体は
# 9.5 の最終確認まで残す
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: directus-db
  namespace: prod
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.8

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "64MB"
      effective_cache_size: "128MB"
      work_mem: "4MB"
      wal_compression: "on"

  bootstrap:
    recovery:
      source: directus-db

  externalClusters:
    - name: directus-db
      barmanObjectStore:
        destinationPath: "s3://aramakisai-backups/cnpg/directus-db"
        endpointURL: "https://fsn1.your-objectstorage.com"
        serverName: directus-db
        s3Credentials:
          accessKeyId:
            name: hetzner-os-credentials
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: hetzner-os-credentials
            key: SECRET_ACCESS_KEY
          region:
            name: hetzner-os-credentials
            key: REGION
        wal:
          compression: gzip
        data:
          compression: gzip

  backup:
    barmanObjectStore:
      destinationPath: "s3://aramakisai-backups/cnpg/directus-db"
      endpointURL: "https://fsn1.your-objectstorage.com"
      serverName: directus-db
      s3Credentials:
        accessKeyId:
          name: hetzner-os-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: hetzner-os-credentials
          key: SECRET_ACCESS_KEY
        region:
          name: hetzner-os-credentials
          key: REGION
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "3d"

  # Payload CMS 用のロール。CNPG 1.23.3 には Database CRD が無いため、
  # データベース自体の作成は cms の PreSync Job (cms-db-init) が psql で行う。
  # そのために必要な CREATEDB をここで宣言的に与える。
  # directus ロールと directus データベースには触れない。
  managed:
    roles:
      - name: payload
        ensure: present
        login: true
        createdb: true
        # CNPG が defaulting で補う値。書いておかないと ArgoCD が常に OutOfSync になる
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: cms-db-credentials

  storage:
    size: 10Gi   # Directus はアセットを DB に保存するため authentik より大きめ

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      # idle時実使用量は約60Miだが、barman-cloud-backup/wal-archiveの
      # バックアップ処理時にメモリスパイクするため256Miでは不足しOOM crash loopした
      # (2026-06-19)。512Miに戻す。
      memory: "512Mi"
      cpu: "500m"
