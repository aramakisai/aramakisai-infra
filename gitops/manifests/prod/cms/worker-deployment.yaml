---
# Payload のジョブ (招待メール送信等) を実行する専用 Pod。
# cms Deployment は CMS_JOBS_AUTORUN=false でジョブを実行せず、ここだけが autoRun を持つ。
# Payload のジョブ取得は排他がないため、実行する Pod は必ず 1 つに限る。
# Recreate にして、rollout 中も旧 Pod と新 Pod が同時に動かないようにする。
# Service・PDB は持たない。ラベルを app: cms と分け、cms 用の Service / PDB / topologySpread の
# selector に拾われないようにする。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-worker
  namespace: prod
  labels:
    app: cms-worker
  annotations:
    secret.reloader.stakater.com/reload: "cms-secrets"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cms-worker
  template:
    metadata:
      labels:
        app: cms-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 65533
        fsGroup: 65533
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cms-worker
          image: ghcr.io/aramakisai/aramakisai-cms:main
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: DATABASE_URL
            - name: DATABASE_REPLICA_URL
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: DATABASE_REPLICA_URL
            - name: PAYLOAD_SECRET
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: PAYLOAD_SECRET
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: S3_SECRET_ACCESS_KEY
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: SMTP_HOST
            - name: NOREPLY_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: NOREPLY_SMTP_PASSWORD
            - name: CLOUDFLARE_ZONE_ID
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: CLOUDFLARE_ZONE_ID
            - name: CLOUDFLARE_PURGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: CLOUDFLARE_PURGE_TOKEN
            - name: SIGNAGE_NOTIFY_ACCESS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: SIGNAGE_NOTIFY_ACCESS_CLIENT_ID
            - name: SIGNAGE_NOTIFY_ACCESS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: SIGNAGE_NOTIFY_ACCESS_CLIENT_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: GEMINI_API_KEY
            - name: PARKING_CAMERA_DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: PARKING_CAMERA_DISCORD_WEBHOOK_URL
            - name: NODE_ENV
              value: production
            - name: CMS_PUBLIC_URL
              value: https://cms.aramakisai.com
            - name: CMS_CORS_ORIGINS
              value: https://aramakisai.com
            - name: S3_BUCKET
              value: aramakisai-cms-media
            - name: S3_ENDPOINT
              value: https://fsn1.your-objectstorage.com
            - name: S3_REGION
              value: fsn1
            # Directus が使う directus-uploads と衝突しないキー空間に置く
            - name: S3_PREFIX
              value: payload-uploads
            # AUTHENTIK_*という変数名だがCMSアプリ側のenv名(historical、値はZitadel)。
            # issuerはZitadelではアプリ単位パスを持たずインスタンスドメイン直下
            # (実機の/.well-known/openid-configuration確認済み)。
            - name: AUTHENTIK_ISSUER_URL
              value: https://idp.aramakisai.com
            - name: SIGNAGE_NOTIFY_URL
              value: https://aramakisai.com/api/signage/notify
            - name: SIGNAGE_QUAKE_URL
              value: https://aramakisai-signage-quake.aramakisai.workers.dev
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/.next/cache}
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "800m"
          # ジョブ実行が主役なので readiness は不要 (Service が無い)。
          # プロセスが固まったときだけ再起動する
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: next-cache, emptyDir: {}}
