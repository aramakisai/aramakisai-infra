---
# マイグレーション適用 PreSync Job
# Payload は起動時にスキーマの存在を前提とするため、Deployment の更新より前に適用する。
# Payload の CLI と TypeScript のマイグレーションは Next の standalone 出力に含まれないため、
# ビルド途中の段階 (migrator) を別タグとして押し出したイメージを使う
apiVersion: batch/v1
kind: Job
metadata:
  name: cms-migrate
  namespace: prod
  annotations:
    argocd.argoproj.io/hook: PreSync
    # 成功時も ttlSecondsAfterFinished まで残し、適用されたマイグレーションをログで確認できるようにする
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/aramakisai/aramakisai-cms-migrate:main
          # payload CLI は設定読み込み中に何も出力せず exit 0 で終わることがあり、終了コードでは
          # 未適用を検出できない。完了ログ "Done." で成否を判定し、冪等なので再試行する
          command:
            - sh
            - -c
            - |
              for attempt in 1 2 3; do
                node_modules/.bin/payload migrate 2>&1 | tee /tmp/migrate.log
                grep -q 'Done\.' /tmp/migrate.log && exit 0
                echo "payload migrate が完了ログを出さずに終了した (試行 $attempt)"
              done
              exit 1
          envFrom:
            - secretRef:
                name: cms-secrets
          env:
            - name: NODE_OPTIONS
              value: --no-deprecation
            # envFrom の cms-secrets より env が優先される。migrate は primary だけを使う
            - name: DATABASE_REPLICA_URL
              value: ""
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
