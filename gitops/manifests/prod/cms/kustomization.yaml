# newTag は aramakisai-web の cms-ci.yml が commit SHA へ書き換える。
# 実行用とマイグレーション用は同一コミットから作るため常に同じ値を持つ
images:
  - name: ghcr.io/aramakisai/aramakisai-cms
    newTag: 4ed546ba44a246516dd540d2751c9f9aa15d90e1
  - name: ghcr.io/aramakisai/aramakisai-cms-migrate
    newTag: 4ed546ba44a246516dd540d2751c9f9aa15d90e1
