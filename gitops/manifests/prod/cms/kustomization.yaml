---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod

resources:
  - db-init-job.yaml
  - migrate-job.yaml
  - deployment.yaml
  - service.yaml

# newTag は aramakisai-web の cms-ci.yml が commit SHA へ書き換える。
# 実行用とマイグレーション用は同一コミットから作るため常に同じ値を持つ
images:
  - name: ghcr.io/aramakisai/aramakisai-cms
    newTag: d3c010b73fc5fb53ef7ecaa531d67b8eff77d630
  - name: ghcr.io/aramakisai/aramakisai-cms-migrate
    newTag: d3c010b73fc5fb53ef7ecaa531d67b8eff77d630
