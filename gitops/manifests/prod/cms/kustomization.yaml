---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod

resources:
  - db-cluster.yaml
  - scheduled-backup.yaml
  - db-init-job.yaml
  - migrate-job.yaml
  - deployment.yaml
