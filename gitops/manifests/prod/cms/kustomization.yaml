---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod

resources:
  - db-cluster.yaml
  - scheduled-backup.yaml
  - db-init-job.yaml
  - migrate-job.yaml
  - deployment.yaml
  - worker-deployment.yaml
  - service.yaml
  - pdb.yaml
  - jobs-healthcheck-cronjob.yaml

# newTag は aramakisai-web の cms-ci.yml が commit SHA へ書き換える。
# 実行用とマイグレーション用は同一コミットから作るため常に同じ値を持つ
images:
  - name: ghcr.io/aramakisai/aramakisai-cms
    newTag: aee08f44efe81ce79fe25f17e57bee78dd88b97d
  - name: ghcr.io/aramakisai/aramakisai-cms-migrate
    newTag: aee08f44efe81ce79fe25f17e57bee78dd88b97d
