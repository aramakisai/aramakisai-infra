---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms
  namespace: prod
  labels:
    app: cms
  annotations:
    secret.reloader.stakater.com/reload: "cms-secrets"
spec:
  replicas: 3
  revisionHistoryLimit: 2
  # 3 ノードへ分散しているため、新 Pod を追加で起動してから旧 Pod を落とせる (無停止 rollout)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cms
  template:
    metadata:
      labels:
        app: cms
    spec:
      # DB 接続・セッション (JWT)・アップロード (S3) をすべて Pod 外に持つため、どのノードでも動く。
      # ScheduleAnyway なのでノード障害時は残りのノードへ寄って起動を妨げない
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cms
          # rollout 中に旧リビジョンの Pod 数へ引きずられず、新リビジョンをノードへ均等に置く
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: cms
          image: ghcr.io/aramakisai/aramakisai-cms:main
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: cms-secrets   # ESO が生成。DATABASE_URL もここから入る
          env:
            - name: NODE_ENV
              value: production
            - name: CMS_PUBLIC_URL
              value: https://cms.aramakisai.com
            - name: CMS_CORS_ORIGINS
              value: https://aramakisai.com
            - name: S3_BUCKET
              value: aramakisai-backups
            - name: S3_ENDPOINT
              value: https://fsn1.your-objectstorage.com
            - name: S3_REGION
              value: fsn1
            # Directus が使う directus-uploads と衝突しないキー空間に置く
            - name: S3_PREFIX
              value: payload-uploads
            # AUTHENTIK_*という変数名だがCMSアプリ側のenv名(historical、値はZitadel)。
            # issuerはZitadelではアプリ単位パスを持たずインスタンスドメイン直下
            # (実機の/.well-known/openid-configuration確認済み)。
            # AUTHENTIK_CLIENT_IDはZitadelが発行する値でauthentikのような
            # カスタムclient_id指定ができないため、cms-secrets(envFrom)側から注入する
            # (このenv:には置かない、envFromの後にenv:が来ると後勝ちで上書きされるため)。
            - name: AUTHENTIK_ISSUER_URL
              value: https://idp.aramakisai.com
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              # 本番相当ビルドのローカル実測 RSS はアイドル 144MiB、
              # 管理画面 15 回 + REST 30 回のアクセス後で 192MiB。
              # sharp の画像変換ピークだけ未計測のため Directus と同じ 512Mi から始める
              memory: "512Mi"
              # namespace-config/limit-range.yaml の max.cpu と同値(この namespace での上限)
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /admin/login
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
