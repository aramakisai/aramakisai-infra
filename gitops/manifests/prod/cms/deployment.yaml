---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms
  namespace: prod
  labels:
    app: cms
  annotations:
    secret.reloader.stakater.com/reload: "cms-secrets"
spec:
  replicas: 6
  revisionHistoryLimit: 2
  # 3 ノードへ分散しているため、新 Pod を追加で起動してから旧 Pod を落とせる (無停止 rollout)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cms
  template:
    metadata:
      labels:
        app: cms
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 65533
        fsGroup: 65533
        seccompProfile:
          type: RuntimeDefault
      # DB 接続・セッション (JWT)・アップロード (S3) をすべて Pod 外に持つため、どのノードでも動く。
      # ScheduleAnyway なのでノード障害時は残りのノードへ寄って起動を妨げない
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cms
          # rollout 中に旧リビジョンの Pod 数へ引きずられず、新リビジョンをノードへ均等に置く
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: cms
          image: ghcr.io/aramakisai/aramakisai-cms:main
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: DATABASE_URL
            - name: DATABASE_REPLICA_URL
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: DATABASE_REPLICA_URL
            - name: PAYLOAD_SECRET
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: PAYLOAD_SECRET
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: S3_SECRET_ACCESS_KEY
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: SMTP_HOST
            - name: NOREPLY_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: NOREPLY_SMTP_PASSWORD
            - name: CLOUDFLARE_ZONE_ID
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: CLOUDFLARE_ZONE_ID
            - name: CLOUDFLARE_PURGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: CLOUDFLARE_PURGE_TOKEN
            - name: SIGNAGE_NOTIFY_ACCESS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: SIGNAGE_NOTIFY_ACCESS_CLIENT_ID
            - name: SIGNAGE_NOTIFY_ACCESS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: SIGNAGE_NOTIFY_ACCESS_CLIENT_SECRET
            - name: AUTHENTIK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: AUTHENTIK_CLIENT_ID
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: AUTHENTIK_CLIENT_SECRET
            - name: SIGNAGE_QUAKE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cms-secrets
                  key: SIGNAGE_QUAKE_TOKEN
            - name: NODE_ENV
              value: production
            # ジョブの autoRun は cms-worker だけが担う。Payload のジョブ取得は排他がなく、
            # 全レプリカで実行すると同じジョブが重複実行される ("false" のときだけ無効化される)
            - name: CMS_JOBS_AUTORUN
              value: "false"
            - name: CMS_PUBLIC_URL
              value: https://cms.aramakisai.com
            - name: CMS_CORS_ORIGINS
              value: https://aramakisai.com
            - name: S3_BUCKET
              value: aramakisai-cms-media
            - name: S3_ENDPOINT
              value: https://fsn1.your-objectstorage.com
            - name: S3_REGION
              value: fsn1
            # Directus が使う directus-uploads と衝突しないキー空間に置く
            - name: S3_PREFIX
              value: payload-uploads
            # AUTHENTIK_*という変数名だがCMSアプリ側のenv名(historical、値はZitadel)。
            # issuerはZitadelではアプリ単位パスを持たずインスタンスドメイン直下
            # (実機の/.well-known/openid-configuration確認済み)。
            - name: AUTHENTIK_ISSUER_URL
              value: https://idp.aramakisai.com
            - name: SIGNAGE_NOTIFY_URL
              value: https://aramakisai.com/api/signage/notify
            - name: SIGNAGE_QUAKE_URL
              value: https://aramakisai-signage-quake.aramakisai.workers.dev
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/.next/cache}
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              # 本番相当ビルドのローカル実測 RSS はアイドル 144MiB、
              # 管理画面 15 回 + REST 30 回のアクセス後で 192MiB。
              # sharp の画像変換ピークだけ未計測のため Directus と同じ 512Mi から始める
              memory: "512Mi"
              # 1 ノードに 2 Pod 載るため、etcd (k3s server 内) 等のノード常駐プロセスの CPU を残せるよう、
              # 2 Pod 分と他プロセスの合計が allocatable の約 8 割に収まる値にする
              cpu: "800m"
          # /api/health は DB にも Payload にも触れず HTTP 200 だけを返す。
          # readiness に DB を含めると switchover で 3 Pod が同時に NotReady になり全停止するため含めない。
          # /admin/login のような SSR ページは過負荷時に重くなり probe が落ちるため使わない。
          # 起動の完了は startupProbe が待ち、その間 readiness / liveness は動かない (最大 5s x 36 = 180s)
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          # 過負荷で数回遅れても外れないよう 10s x 6 = 60s 連続で失敗したときだけ外す
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # 再起動は受付から外すより重いので readiness より長く待つ (10s x 12 = 120s 連続失敗)。
          # プロセスが HTTP を返せないほど固まったときだけ対象になる
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: next-cache, emptyDir: {}}
