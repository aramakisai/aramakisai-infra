---
# Zitadel api + login (Node.js別プロセス) StatefulSet
# login v2 UIは公式Nextjsコンテナ (ghcr.io/zitadel/zitadel-login) を同一Pod内の
# 別コンテナとして起動する。Pod内のコンテナはnetwork namespaceを共有するため、
# loginコンテナからzitadelコンテナへは localhost:8080 で到達できる
# (docker-composeのnetwork_mode: service:zitadelに相当する構成が既定で成立する)。
#
# ExternalDomainはcloudflaredトンネル経由の公開ホスト名(idp.aramakisai.com)を設定している。
# Tunnel ingress(terraform/tunnel.tf)は/ui/v2/login配下をlogin v2 UI(3000)、それ以外を
# API(8080)へ振り分ける(Zitadel公式reverse proxy設定例と同じパス分割)。そのためlogin v2の
# BASEURI/LoginURL/LogoutURLも公開ホスト名(idp.aramakisai.com)を指す。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zitadel
  namespace: zitadel
spec:
  serviceName: zitadel
  replicas: 1
  selector:
    matchLabels:
      app: zitadel
  template:
    metadata:
      labels:
        app: zitadel
    spec:
      # Service名が"zitadel"のため、k8sが自動注入するDocker links形式の環境変数
      # (ZITADEL_PORT=tcp://...等) がZitadel自身のZITADEL_PORT設定と衝突し
      # "'Port' cannot parse value as 'uint16'"で起動失敗するため無効化する
      enableServiceLinks: false
      # login-client.pat / zitadel-admin-sa.pat の受け渡し用 (永続不要、Pod再作成毎に再発行されて良い)
      volumes:
        - name: zitadel-data
          emptyDir: {}
      containers:
        - name: zitadel
          image: ghcr.io/zitadel/zitadel:v4.12.3
          command: ["/app/zitadel"]
          args:
            - start-from-init
            - --masterkey
            - $(ZITADEL_MASTERKEY)
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: zitadel-data
              mountPath: /zitadel-data
          env:
            - name: ZITADEL_MASTERKEY
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: MASTERKEY
            - name: ZITADEL_EXTERNALDOMAIN
              value: idp.aramakisai.com
            - name: ZITADEL_EXTERNALPORT
              value: "443"
            - name: ZITADEL_EXTERNALSECURE
              value: "true"
            - name: ZITADEL_TLS_ENABLED
              value: "false"
            # --- DB接続 (CNPG zitadel-db) ---
            - name: ZITADEL_DATABASE_POSTGRES_HOST
              value: zitadel-db-rw
            - name: ZITADEL_DATABASE_POSTGRES_PORT
              value: "5432"
            - name: ZITADEL_DATABASE_POSTGRES_DATABASE
              value: zitadel
            - name: ZITADEL_DATABASE_POSTGRES_USER_USERNAME
              value: zitadel
            - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-db-credentials
                  key: password
            - name: ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE
              value: disable
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME
              value: postgres
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-db-superuser
                  key: password
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE
              value: disable
            # --- Login v2 (別コンテナ) を唯一のログインUIとして使う ---
            - name: ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED
              value: "true"
            - name: ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI
              value: https://idp.aramakisai.com/ui/v2/login/
            - name: ZITADEL_OIDC_DEFAULTLOGINURLV2
              value: https://idp.aramakisai.com/ui/v2/login/login?authRequest=
            - name: ZITADEL_OIDC_DEFAULTLOGOUTURLV2
              value: https://idp.aramakisai.com/ui/v2/login/logout?post_logout_redirect=
            # --- login-client (login v2 UIがZitadel APIを呼ぶためのmachine user PAT) を
            #     初回起動時に自動発行する。IAM_LOGIN_CLIENT roleが自動付与される ---
            - name: ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH
              value: /zitadel-data/login-client.pat
            - name: ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME
              value: login-client
            - name: ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME
              value: "Login Client Service Account"
            - name: ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE
              value: "2029-01-01T00:00:00Z"
            # --- Terraform provider用 machine user + PAT (IAM_OWNER) を初回起動時に自動発行する。
            #     ansible/roles/zitadel-bootstrap がこのPATファイルを kubectl exec 経由で回収する ---
            - name: ZITADEL_FIRSTINSTANCE_PATPATH
              value: /zitadel-data/zitadel-admin-sa.pat
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME
              value: terraform-provider
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME
              value: "Terraform Provider Service Account"
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE
              value: "2029-01-01T00:00:00Z"
          startupProbe:
            exec:
              command: ["/app/zitadel", "ready"]
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["/app/zitadel", "ready"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/app/zitadel", "ready"]
            periodSeconds: 30
          resources:
            # PoC暫定値。task 1.3 の実測を踏まえて見直す
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
        - name: login
          image: ghcr.io/zitadel/zitadel-login:v4.12.3
          ports:
            - name: login
              containerPort: 3000
          volumeMounts:
            - name: zitadel-data
              mountPath: /zitadel-data
              readOnly: true
          env:
            # localhost指定だとHostヘッダがExternalDomain(zitadel.zitadel.svc.cluster.local)と
            # 不一致になりinstance解決に失敗する(Errors.Instance.NotFound)ため、
            # ExternalDomainと同一のService DNS名を指定する
            - name: ZITADEL_API_URL
              value: http://zitadel.zitadel.svc.cluster.local:8080
            - name: NEXT_PUBLIC_BASE_PATH
              value: /ui/v2/login
            - name: ZITADEL_SERVICE_USER_TOKEN_FILE
              value: /zitadel-data/login-client.pat
          resources:
            # PoC暫定値。task 1.3 の実測を踏まえて見直す
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
