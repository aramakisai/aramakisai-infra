---
# Zitadel 用 PostgreSQL クラスター (CloudNativePG)。
# CNPG operator (wave: -1) が先にインストールされている前提。
# bootstrap.recovery は PVC が無い状態で Cluster が作られるとき (ノード全喪失後の DR) にだけ
# 参照される。稼働中クラスターの spec.bootstrap 変更は operator が無視する
# (webhook に変更検証が無く、primary 生成は PVC 不在かつ LatestGeneratedNode=0 のときだけ)。
# 取得済みバックアップが無い完全な新規構築では recovery が失敗するため、その場合のみ
# initdb (database/owner/secret は下記 recovery と同じ値) に差し替えて投入する。
# serverName が backup 先と同一なので WAL アーカイブ空チェックは skipEmptyWalArchiveCheck で外す。
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-db
  namespace: zitadel
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.8

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "64MB"
      effective_cache_size: "128MB"
      work_mem: "4MB"
      wal_compression: "on"

  # Zitadelはsetup時にDB/extension作成でpostgres superuser接続(ADMIN)を、
  # 定常稼働時はzitadelロール接続(USER)を使い分けるため、superuser secretを公開する
  # (CNPGが自動生成する `zitadel-db-superuser` Secret)
  enableSuperuserAccess: true

  bootstrap:
    recovery:
      source: zitadel-db
      database: zitadel
      owner: zitadel
      secret:
        name: zitadel-db-credentials   # ESO が生成する Secret (external-secret.yaml)

  externalClusters:
    - name: zitadel-db
      barmanObjectStore:
        destinationPath: "s3://aramakisai-backups/cnpg/zitadel-db"
        endpointURL: "https://fsn1.your-objectstorage.com"
        serverName: zitadel-db
        s3Credentials:
          accessKeyId:
            name: hetzner-os-credentials
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: hetzner-os-credentials
            key: SECRET_ACCESS_KEY
          region:
            name: hetzner-os-credentials
            key: REGION
        wal:
          compression: gzip
        data:
          compression: gzip

  backup:
    barmanObjectStore:
      destinationPath: "s3://aramakisai-backups/cnpg/zitadel-db"
      endpointURL: "https://fsn1.your-objectstorage.com"
      serverName: zitadel-db
      s3Credentials:
        accessKeyId:
          name: hetzner-os-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: hetzner-os-credentials
          key: SECRET_ACCESS_KEY
        region:
          name: hetzner-os-credentials
          key: REGION
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "14d"

  storage:
    size: 5Gi

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
