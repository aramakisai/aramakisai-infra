---
# Zitadel 用 PostgreSQL クラスター (CloudNativePG)
# CNPG operator (wave: -1) が先にインストールされている前提。
# authentik-db (gitops/manifests/prod/authentik/db-cluster.yaml) と同水準の
# instances/storage/resourcesを踏襲する。新規アプリのため既存バックアップが存在せず、
# bootstrap は (authentikの初回投入時と同じく) initdb を使う。backup.barmanObjectStore は
# 稼働開始後のバックアップ取得先として day 1 から設定するが、bootstrap.recovery による
# 復元は初回投入時点では対象外 (取得済みバックアップが無いため)。
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-db
  namespace: zitadel
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.8

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "64MB"
      effective_cache_size: "128MB"
      work_mem: "4MB"
      wal_compression: "on"

  # Zitadelはsetup時にDB/extension作成でpostgres superuser接続(ADMIN)を、
  # 定常稼働時はzitadelロール接続(USER)を使い分けるため、superuser secretを公開する
  # (CNPGが自動生成する `zitadel-db-superuser` Secret)
  enableSuperuserAccess: true

  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
      secret:
        name: zitadel-db-credentials   # ESO が生成する Secret (external-secret.yaml)

  storage:
    size: 5Gi

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
