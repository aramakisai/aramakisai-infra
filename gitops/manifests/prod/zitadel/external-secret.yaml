---
# Zitadel アプリケーション用シークレット (masterkey等)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-secrets
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: zitadel-secrets
    creationPolicy: Owner
  data:
    - secretKey: MASTERKEY
      remoteRef:
        key: ZITADEL_MASTERKEY
---
# CloudNativePG Cluster 用 DB 認証情報 (zitadelロール接続用)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-credentials
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: zitadel-db-credentials
    creationPolicy: Owner
    template:
      data:
        username: "zitadel"
        password: "{{ .ZITADEL_DB_PASSWORD }}"
  data:
    - secretKey: ZITADEL_DB_PASSWORD
      remoteRef:
        key: ZITADEL_DB_PASSWORD
---
# login v2 UI(loginコンテナ)用 login-client PAT (ansible/playbooks/zitadel-login-client-pat.ymlが発行)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-login-client
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: zitadel-login-client
    creationPolicy: Owner
  data:
    - secretKey: TOKEN
      remoteRef:
        key: ZITADEL_LOGIN_CLIENT_PAT
