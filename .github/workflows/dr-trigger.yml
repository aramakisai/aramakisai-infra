name: DR Trigger

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# 同時実行を防ぐ (Issue の状態判定が前回実行の結果に依存するため)
concurrency:
  group: dr-trigger
  cancel-in-progress: false

env:
  # 現行のdr-trigger.shはprod-node-1決め打ちでetcdクォーラムを考慮しないため、
  # 複数ノード稼働中はfalseにして定期実行による誤検知でのノード再作成を防ぐ。
  # 切替はこの行の変更としてコミットに残す (GitHub UI上のworkflow無効化は使わない)。
  DR_TRIGGER_ENABLED: "true"

# repository_dispatch (POST /repos/{owner}/{repo}/dispatches) には
# Contents: write が必要 (GitHub公式ドキュメント: Fine-grained token permission set)。
# Issue 作成・コメント・クローズには Issues: write が必要。
permissions:
  contents: write
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Install Infisical CLI
        if: env.DR_TRIGGER_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          # Cloudsmithは2026-09-16でLinux配信終了のためartifacts-cli.infisical.comへ移行済み
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical

      - name: Run DR trigger detection
        if: env.DR_TRIGGER_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          # infisical run はUniversal Auth環境変数を自動認識しないため、
          # 明示的にlogin --method=universal-authでトークンを取得し --token で渡す。
          # トークンはログに出力されうるため ::add-mask:: で確実にマスクする。
          INFISICAL_TOKEN=$(infisical login --method=universal-auth \
            --client-id="${INFISICAL_CLIENT_ID}" \
            --client-secret="${INFISICAL_CLIENT_SECRET}" \
            --silent --plain)
          echo "::add-mask::${INFISICAL_TOKEN}"

          infisical run --token="${INFISICAL_TOKEN}" --projectId="${INFISICAL_PROJECT_ID}" --env=prod -- bash .github/scripts/dr-trigger.sh
