name: Intrusion Response

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: '対象 namespace (必須、例: prod)'
        required: true
        type: string
      pod_selector:
        description: 'Pod セレクター (任意、空の場合は namespace 全 Pod を対象)'
        required: false
        default: ''
        type: string

concurrency:
  group: intrusion-response
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  forensics:
    name: Forensics — 証拠保全
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
      id-token: write

    steps:
      - name: Validate inputs
        run: |
          if [[ -z "${{ inputs.namespace }}" ]]; then
            echo "::error::namespace が空です。対象 namespace を指定してください"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 接続先は Tailscale MagicDNS 名 (prod-node-1) のため、ランナーを tailnet に参加させる
      - name: Setup Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -Ls https://dl.k8s.io/release/stable.txt)
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Collect forensics data
        env:
          IR_NAMESPACE: ${{ inputs.namespace }}
          IR_POD_SELECTOR: ${{ inputs.pod_selector }}
        run: |
          export KUBECONFIG="${RUNNER_TEMP}/kubeconfig"
          bash .github/scripts/kube-oidc.sh kubeconfig "${KUBECONFIG}" \
            || { echo "::error::OIDC kubeconfig の生成に失敗しました"; exit 1; }
          mkdir -p /tmp/forensics

          # exec プラグインが stderr に出す ::add-mask:: 行を証拠ファイルに混ぜない
          capture() {
            local out="$1" err rc
            shift
            err="$(mktemp)"
            kubectl "$@" >"${out}" 2>"${err}"
            rc=$?
            grep -v '^::add-mask::' "${err}" >>"${out}" || true
            rm -f "${err}"
            return "${rc}"
          }

          capture /tmp/forensics/pod-logs.txt logs \
            -n "${IR_NAMESPACE}" --all-containers --tail=1000 \
            || echo "::warning::Pod ログの取得に失敗しました (部分取得の可能性あり)"

          capture /tmp/forensics/events.txt get events \
            -n "${IR_NAMESPACE}" --sort-by='.lastTimestamp' \
            || echo "::warning::Events の取得に失敗しました"

          capture /tmp/forensics/networkpolicies.yaml get networkpolicy \
            -n "${IR_NAMESPACE}" -o yaml \
            || echo "::warning::NetworkPolicy の取得に失敗しました"

          capture /tmp/forensics/pods.txt get pods \
            -n "${IR_NAMESPACE}" -o wide \
            || echo "::warning::Pod 一覧の取得に失敗しました"

          echo "namespace=${IR_NAMESPACE}" > /tmp/forensics/metadata.txt
          echo "pod_selector=${IR_POD_SELECTOR}" >> /tmp/forensics/metadata.txt
          echo "collected_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> /tmp/forensics/metadata.txt

      - name: Upload forensics artifacts
        uses: actions/upload-artifact@v7
        with:
          name: forensics-${{ inputs.namespace }}-${{ github.run_id }}
          path: /tmp/forensics/
          retention-days: 90

  isolate:
    name: Isolate — ネットワーク遮断
    runs-on: ubuntu-latest
    needs: forensics
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -Ls https://dl.k8s.io/release/stable.txt)
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Apply isolation NetworkPolicy
        env:
          IR_NAMESPACE: ${{ inputs.namespace }}
        run: |
          export KUBECONFIG="${RUNNER_TEMP}/kubeconfig"
          bash .github/scripts/kube-oidc.sh kubeconfig "${KUBECONFIG}" \
            || { echo "::error::OIDC kubeconfig の生成に失敗しました"; exit 1; }

          # gha:intrusion-response は networkpolicies の create しか持たない (patch 不可) ため apply は使えない。
          # 再実行時に既に遮断済みなら成功として扱う
          err="$(mktemp)"
          if kubectl create --validate=false -f - 2>"${err}" <<EOF
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: intrusion-isolation
            namespace: ${IR_NAMESPACE}
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
              - Egress
          EOF
          then
            echo "NetworkPolicy intrusion-isolation を作成しました"
          elif grep -q 'AlreadyExists' "${err}"; then
            echo "NetworkPolicy intrusion-isolation は既に存在します (遮断済み)"
          else
            grep -v '^::add-mask::' "${err}" || true
            echo "::error::隔離 NetworkPolicy の作成に失敗しました"
            exit 1
          fi

          echo "NetworkPolicy 適用完了: namespace=${IR_NAMESPACE} の全 Pod の ingress/egress を遮断しました"

  notify:
    name: Notify — Discord ローテーション通知
    runs-on: ubuntu-latest
    needs: isolate
    timeout-minutes: 5

    steps:
      - name: Send Discord notification
        run: |
          NAMESPACE="${{ inputs.namespace }}"
          POD_SELECTOR="${{ inputs.pod_selector }}"
          PS_DISPLAY="${POD_SELECTOR:-全 Pod}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          WEBHOOK="${{ secrets.DISCORD_OPS_WEBHOOK_URL }}"

          # メッセージ1: サマリー (2000文字以内に収める)
          BODY1=$(jq -n \
            --arg ns "${NAMESPACE}" \
            --arg ps "${PS_DISPLAY}" \
            --arg url "${RUN_URL}" \
            '{content: ("🚨 **侵入対応実行完了** 🚨\n\n**対象 namespace**: `" + $ns + "`\n**Pod セレクター**: `" + $ps + "`\n**実行ログ**: " + $url + "\n\n**実施済み**:\n• forensics 保存済み (Artifacts 90日保持)\n• NetworkPolicy 適用済み (ingress/egress 全遮断)\n\n⚠️ **次のアクション**:\n1. 下記シークレットを全てローテーション (次のメッセージ参照)\n2. GitHub Secrets の `INFISICAL_CLIENT_ID`/`INFISICAL_CLIENT_SECRET` もローテーション\n3. **ローテーション完了後**に `dr-recovery` を手動 dispatch\n\n🔴 **ローテーション完了前に `dr-recovery` を実行しないこと**")}')

          curl -sf -X POST "${WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "${BODY1}" \
            || { echo "::error::Discord 通知 (サマリー) の送信に失敗しました"; exit 1; }

          # メッセージ2: ローテーション必須シークレット一覧
          BODY2=$(jq -n '{content: "**ローテーション必須 (Infisical)**:\n`HCLOUD_TOKEN` `CLOUDFLARE_API_TOKEN` `TAILSCALE_OAUTH_CLIENT_ID` `TAILSCALE_OAUTH_CLIENT_SECRET`\n`TF_VAR_k3s_token` `TF_VAR_tailscale_api_key` `TF_VAR_authentik_cf_client_id` `TF_VAR_authentik_cf_client_secret`\n`K3S_TOKEN` `CLOUDFLARE_TUNNEL_TOKEN` `CLOUDFLARE_TUNNEL_ID` `INFISICAL_CLIENT_ID` `INFISICAL_CLIENT_SECRET`\n`ARGOCD_GITHUB_DEPLOY_KEY` `TFC_API_TOKEN` `TFC_WORKSPACE_ID` `TAILSCALE_API_KEY` `TAILSCALE_TAILNET`\n`AUTHENTIK_SECRET_KEY` `AUTHENTIK_DB_PASSWORD` `NOREPLY_SMTP_PASSWORD`\n`MAILSERVER_LDAP_BIND_PASSWORD` `MAILSERVER_DKIM_KEY` `MAILSERVER_RESTIC_PASSWORD` `B2_APPLICATION_KEY_ID` `B2_APPLICATION_KEY`\n`DIRECTUS_SECRET` `DIRECTUS_ADMIN_EMAIL` `DIRECTUS_ADMIN_PASSWORD` `DIRECTUS_DB_PASSWORD`\n`LOKI_URL` `LOKI_USERNAME` `LOKI_PASSWORD` `PROMETHEUS_REMOTE_WRITE_URL` `PROMETHEUS_USERNAME` `PROMETHEUS_PASSWORD`\n`MAIL_OAUTH2_CLIENT_SECRET` `ROUNDCUBE_DES_KEY`\n`TF_VAR_authentik_room_presence_client_secret` `PRESENCE_AUTH_SECRET` `PRESENCE_AUTHENTIK_API_TOKEN` `PRESENCE_RESET_SECRET` `PRESENCE_DISCORD_BOT_TOKEN`\n`VAULTWARDEN_ADMIN_TOKEN` `VAULTWARDEN_DB_PASSWORD` `VAULTWARDEN_OIDC_CLIENT_ID` `VAULTWARDEN_OIDC_CLIENT_SECRET` `VAULTWARDEN_RESTIC_PASSWORD`\n`VAULTWARDEN_RBAC_SYNC_AUTHENTIK_API_TOKEN` `VAULTWARDEN_RBAC_SYNC_SERVICE_ACCOUNT_CLIENT_ID` `VAULTWARDEN_RBAC_SYNC_SERVICE_ACCOUNT_CLIENT_SECRET`\n`TF_VAR_vaultwarden_rbac_sync_trigger_token` `DISCORD_OPS_WEBHOOK_URL`\n\n**GitHub Actions Secrets もローテーション**:\n`INFISICAL_CLIENT_ID` `INFISICAL_CLIENT_SECRET`"}')

          curl -sf -X POST "${WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "${BODY2}" \
            || echo "::warning::Discord 通知 (シークレット一覧) の送信に失敗しました"
